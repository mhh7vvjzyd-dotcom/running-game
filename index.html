<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🏃 Превью зон Нячанг</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #1a1a2e; }
    #map { height: 100vh; width: 100vw; }
    
    .info {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 14px 24px;
      border-radius: 16px;
      z-index: 1000;
      font-size: 14px;
      text-align: center;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      max-width: 90%;
    }
    .info span { color: #2ecc71; font-weight: bold; }
    
    .zone-label {
      background: rgba(0,0,0,0.8);
      color: white;
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 18px;
      font-weight: bold;
      border: 2px solid rgba(255,255,255,0.3);
      text-align: center;
      pointer-events: none;
      font-family: monospace;
      text-shadow: 0 0 10px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>

  <div id="map"></div>
  
  <div class="info">
    🏛️ Превью зон Нячанга<br>
    <span>Север (01)</span> · <span>Центр (02)</span> · <span>Юг (03)</span>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ============================================================
    // 3 ЗОНЫ ВДОЛЬ БЕРЕГА НЯЧАНГА (ТОЛЬКО СУША)
    // ============================================================
    const zones = [
      {
        id: '01',
        name: 'Север',
        color: '#3498db',
        coords: [
          [12.285, 109.190],
          [12.285, 109.208],
          [12.265, 109.208],
          [12.265, 109.190],
          [12.285, 109.190]
        ]
      },
      {
        id: '02',
        name: 'Центр',
        color: '#2ecc71',
        coords: [
          [12.250, 109.185],
          [12.250, 109.205],
          [12.230, 109.205],
          [12.230, 109.185],
          [12.250, 109.185]
        ]
      },
      {
        id: '03',
        name: 'Юг',
        color: '#e67e22',
        coords: [
          [12.215, 109.182],
          [12.215, 109.202],
          [12.195, 109.202],
          [12.195, 109.182],
          [12.215, 109.182]
        ]
      }
    ];

    // ============================================================
    // КАРТА
    // ============================================================
    const map = L.map('map', {
      center: [12.240, 109.195],
      zoom: 12,
      zoomControl: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // ============================================================
    // РИСУЕМ ЗОНЫ
    // ============================================================
    zones.forEach(zone => {
      // Вычисляем центр
      let latSum = 0, lngSum = 0;
      zone.coords.forEach(p => { latSum += p[0]; lngSum += p[1]; });
      const centerLat = latSum / zone.coords.length;
      const centerLng = lngSum / zone.coords.length;

      // Полигон
      const polygon = L.polygon(zone.coords, {
        color: zone.color,
        weight: 3,
        opacity: 0.9,
        fillColor: zone.color,
        fillOpacity: 0.25,
        interactive: true,
      });

      polygon.bindPopup(`
        <b>🏛️ Зона ${zone.id}</b><br>
        📍 Район: ${zone.name}<br>
        📐 Площадь: ~${Math.round(zone.coords.length * 0.8)} км²
      `);

      polygon.addTo(map);

      // Метка с номером
      const label = L.marker([centerLat, centerLng], {
        icon: L.divIcon({
          className: 'zone-label',
          html: zone.id,
          iconSize: [40, 30],
          iconAnchor: [20, 15]
        }),
        interactive: false
      });
      label.addTo(map);
    });

    // ============================================================
    // ДОБАВЛЯЕМ ОРИЕНТИРЫ
    // ============================================================
    // Береговая линия (примерно)
    const beachLine = [
      [12.290, 109.215],
      [12.280, 109.215],
      [12.270, 109.215],
      [12.260, 109.213],
      [12.250, 109.212],
      [12.240, 109.210],
      [12.230, 109.210],
      [12.220, 109.208],
      [12.210, 109.208],
      [12.200, 109.205],
      [12.190, 109.205]
    ];

    L.polyline(beachLine, {
      color: '#f1c40f',
      weight: 2,
      opacity: 0.4,
      dashArray: '5, 5'
    }).addTo(map).bindPopup('🏖️ Береговая линия');

    // Подписи районов
    const labels = [
      { lat: 12.275, lng: 109.185, text: '📍 СЕВЕР' },
      { lat: 12.240, lng: 109.180, text: '📍 ЦЕНТР' },
      { lat: 12.205, lng: 109.178, text: '📍 ЮГ' }
    ];

    labels.forEach(l => {
      L.marker([l.lat, l.lng], {
        icon: L.divIcon({
          className: 'region-label',
          html: `<div style="
            color: white;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 0 12px rgba(0,0,0,0.9);
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 8px;
            border-left: 3px solid #f1c40f;
          ">${l.text}</div>`,
          iconSize: [120, 30],
          iconAnchor: [60, 15]
        }),
        interactive: false
      }).addTo(map);
    });

    // ============================================================
    // АВТОЦЕНТРИРОВАНИЕ ПО GPS (если доступно)
    // ============================================================
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          map.setView([pos.coords.latitude, pos.coords.longitude], 14);
        },
        () => {},
        { enableHighAccuracy: true }
      );
    }

    console.log('🏛️ Превью зон Нячанга загружено!');
    console.log(`📍 Зон на карте: ${zones.length}`);
  </script>
</body>
</html>
