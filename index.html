<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🏃 Карта Нячанга — Полигон</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, Arial, sans-serif; background: #0f0f1a; }
    #map { height: 100vh; width: 100vw; }
    
    .info-panel {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 10px 16px;
      border-radius: 14px;
      display: flex;
      justify-content: space-around;
      z-index: 1000;
      font-size: 13px;
      backdrop-filter: blur(12px);
      flex-wrap: wrap;
      gap: 8px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .badge-green { background: #2ecc71; border-radius: 20px; padding: 2px 12px; font-weight: bold; }
    .badge-gray { background: #555; border-radius: 20px; padding: 2px 12px; }
    
    .controls {
      position: fixed;
      bottom: 40px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 1000;
    }
    
    button {
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      color: white;
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      box-shadow: 0 4px 20px rgba(46,204,113,0.3);
      cursor: pointer;
      transition: 0.3s;
      min-width: 140px;
    }
    button:active { transform: scale(0.95); }
    .stop-btn { background: linear-gradient(135deg, #e74c3c, #c0392b); }
    .reset-btn {
      background: linear-gradient(135deg, #555, #333);
      min-width: 56px;
      padding: 16px 18px;
    }
    
    .stats {
      position: fixed;
      bottom: 120px;
      right: 16px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 12px;
      z-index: 1000;
      backdrop-filter: blur(10px);
      max-width: 170px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .stats h4 { margin-bottom: 6px; border-bottom: 1px solid #444; padding-bottom: 4px; }
    .stat-item { padding: 3px 0; border-bottom: 1px solid #2a2a2a; font-size: 11px; }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="info-panel" id="infoPanel">
    <span id="pointsCount">📍 8 точек</span>
    <span id="distanceDisplay">📏 0 м</span>
    <span id="loopStatus" class="badge-green">🔒 ЗАМКНУТО</span>
  </div>

  <div class="stats" id="statsPanel">
    <h4>🏃 Трек</h4>
    <div id="statsContent">Ожидание старта</div>
  </div>

  <div class="controls">
    <button class="reset-btn" id="resetBtn">🗑️</button>
    <button id="actionBtn">🏃 СТАРТ</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ============================================================
    // КАРТА НЯЧАНГА
    // ============================================================
    const map = L.map('map', {
      center: [12.295, 109.216],
      zoom: 15,
      zoomControl: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // ============================================================
    // ТВОИ ТОЧКИ (В ПОРЯДКЕ ДОБАВЛЕНИЯ)
    // ============================================================
    const points = [
      { lat: 12.2959054, lng: 109.2216405, name: '📍 Точка 1' },
      { lat: 12.2951267, lng: 109.2177517, name: '📍 Точка 2' },
      { lat: 12.2923235, lng: 109.2125609, name: '📍 Точка 3' },
      { lat: 12.2924772, lng: 109.2094382, name: '📍 Точка 4' },
      { lat: 12.2941344, lng: 109.2126608, name: '📍 Точка 5' },
      { lat: 12.2956220, lng: 109.2136707, name: '📍 Точка 6' },
      { lat: 12.2972075, lng: 109.2161775, name: '📍 Точка 7' },
      { lat: 12.2974191, lng: 109.2184759, name: '📍 Точка 8' }
    ];

    // Преобразуем в формат [lat, lng] для полигона
    const polygonCoords = points.map(p => [p.lat, p.lng]);

    // ============================================================
    // РИСУЕМ ПОЛИГОН (ЗАМКНУТАЯ ОБЛАСТЬ)
    // ============================================================
    const polygon = L.polygon(polygonCoords, {
      color: '#2ecc71',
      weight: 3,
      opacity: 0.9,
      fillColor: '#2ecc71',
      fillOpacity: 0.2,
      smoothFactor: 1
    }).addTo(map);

    polygon.bindPopup(`
      <b>🏛️ Захваченная территория</b><br>
      Точек: ${points.length}<br>
      Площадь: ~${Math.round(L.polygon(polygonCoords).getArea())} м²
    `);

    // ============================================================
    // РИСУЕМ МАРКЕРЫ
    // ============================================================
    points.forEach((p, index) => {
      const marker = L.marker([p.lat, p.lng])
        .addTo(map)
        .bindPopup(`<b>${p.name}</b><br>${p.lat}, ${p.lng}`);

      // Подпись номера точки
      const label = L.marker([p.lat, p.lng], {
        icon: L.divIcon({
          className: 'point-label',
          html: `<div style="
            background: rgba(0,0,0,0.7);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            border: 2px solid #2ecc71;
          ">${index + 1}</div>`,
          iconSize: [20, 20],
          iconAnchor: [10, 10]
        }),
        interactive: false
      });
      label.addTo(map);
    });

    // ============================================================
    // СОСТОЯНИЕ
    // ============================================================
    let isRunning = false;
    let route = [];
    let watchId = null;
    let polyline = null;

    const pointsSpan = document.getElementById('pointsCount');
    const distanceSpan = document.getElementById('distanceDisplay');
    const loopSpan = document.getElementById('loopStatus');
    const statsContent = document.getElementById('statsContent');
    const actionBtn = document.getElementById('actionBtn');
    const resetBtn = document.getElementById('resetBtn');

    // ============================================================
    // ФУНКЦИИ
    // ============================================================
    function calcDistance(points) {
      if (points.length < 2) return 0;
      let total = 0;
      for (let i = 1; i < points.length; i++) {
        total += map.distance(points[i-1], points[i]);
      }
      return total;
    }

    function isLoopClosed(points) {
      if (points.length < 5) return false;
      return map.distance(points[0], points[points.length-1]) < 50;
    }

    function updateUI() {
      pointsSpan.textContent = '📍 ' + route.length + ' точек';
      distanceSpan.textContent = '📏 ' + Math.round(calcDistance(route)) + ' м';
      
      if (isLoopClosed(route) && route.length > 0) {
        loopSpan.textContent = '🔒 ЗАМКНУТО';
        loopSpan.className = 'badge-green';
      } else {
        loopSpan.textContent = '🔓 Не замкнуто';
        loopSpan.className = 'badge-gray';
      }

      if (route.length > 0) {
        statsContent.innerHTML = `
          <div class="stat-item">📍 Точек: ${route.length}</div>
          <div class="stat-item">📏 Дистанция: ${Math.round(calcDistance(route))} м</div>
          <div class="stat-item" style="border-bottom:none;color:#2ecc71;">${isLoopClosed(route) ? '✅ Замкнуто' : '⭕ Разомкнуто'}</div>
        `;
      } else {
        statsContent.textContent = 'Ожидание старта';
      }
    }

    // ============================================================
    // УПРАВЛЕНИЕ БЕГОМ
    // ============================================================
    function startRun() {
      route = [];
      isRunning = true;
      actionBtn.textContent = '⏹ СТОП';
      actionBtn.className = 'stop-btn';
      if (polyline) { map.removeLayer(polyline); polyline = null; }

      navigator.geolocation.getCurrentPosition(
        pos => {
          route.push([pos.coords.latitude, pos.coords.longitude]);
          updateUI();
        },
        () => {},
        { enableHighAccuracy: true }
      );

      watchId = navigator.geolocation.watchPosition(
        pos => {
          const p = [pos.coords.latitude, pos.coords.longitude];
          route.push(p);
          if (polyline) map.removeLayer(polyline);
          polyline = L.polyline(route, { color: '#e74c3c', weight: 4, opacity: 0.9 }).addTo(map);
          map.setView(p, 15);
          updateUI();
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 2000 }
      );
    }

    function stopRun() {
      if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      isRunning = false;
      actionBtn.textContent = '🏃 СТАРТ';
      actionBtn.className = '';

      if (route.length < 5) {
        alert('❌ Слишком короткий маршрут (минимум 5 точек)');
        return;
      }

      if (isLoopClosed(route)) {
        const distance = Math.round(calcDistance(route));
        alert(`✅ Маршрут замкнут!\nДистанция: ${distance} м\nТочек: ${route.length}`);
      } else {
        alert('❌ Маршрут не замкнут!\nВернись в точку старта (расстояние < 50 м)');
      }
      updateUI();
    }

    function resetGame() {
      if (isRunning) {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        isRunning = false;
        actionBtn.textContent = '🏃 СТАРТ';
        actionBtn.className = '';
      }
      route = [];
      if (polyline) { map.removeLayer(polyline); polyline = null; }
      updateUI();
      statsContent.textContent = 'Ожидание старта';
    }

    // ============================================================
    // КНОПКИ
    // ============================================================
    actionBtn.addEventListener('click', () => isRunning ? stopRun() : startRun());
    resetBtn.addEventListener('click', resetGame);

    // ============================================================
    // ГЕОЛОКАЦИЯ
    // ============================================================
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          map.setView([pos.coords.latitude, pos.coords.longitude], 15);
          L.marker([pos.coords.latitude, pos.coords.longitude])
            .addTo(map)
            .bindPopup('📍 Вы здесь');
        },
        () => {},
        { enableHighAccuracy: true }
      );
    }

    updateUI();
    console.log('🏃 Карта Нячанга — 8 точек, полигон замкнут');
  </script>
</body>
</html>
