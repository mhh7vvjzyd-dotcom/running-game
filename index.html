<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Захват Зон Нячанг</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: white; overflow: hidden; height: 100vh; width: 100vw; }

        /* --- РЕГИСТРАЦИЯ --- */
        #registerModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); display: flex; justify-content: center; align-items: center;
            z-index: 9999; backdrop-filter: blur(4px);
        }
        .reg-box {
            background: #1e293b; padding: 30px; border-radius: 20px; width: 90%; max-width: 360px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8); text-align: center;
        }
        .reg-box h2 { color: #facc15; font-size: 22px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .reg-input {
            width: 100%; padding: 14px; border-radius: 10px; border: none;
            background: #334155; color: white; font-size: 16px; margin-bottom: 15px; outline: none;
        }
        .reg-input::placeholder { color: #94a3b8; }
        .palette { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .c-block {
            width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
            border: 4px solid transparent; transition: all 0.2s ease;
        }
        .c-block.active { border-color: white; transform: scale(1.15); box-shadow: 0 0 15px rgba(255,255,255,0.5); }
        .btn-start-game {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            background: #22c55e; color: white; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-start-game:active { transform: scale(0.95); background: #16a34a; }

        /* --- ИГРОВОЙ ИНТЕРФЕЙС --- */
        #gameContainer { display: none; width: 100%; height: 100%; position: relative; }
        
        #mapCanvas {
            width: 100%; height: 100%; background: #1a2332;
            background-image: radial-gradient(circle, #2a3a52 1px, transparent 1px);
            background-size: 40px 40px; position: relative; overflow: hidden;
        }
        
        /* Зоны */
        .zone {
            position: absolute; background: rgba(100, 116, 139, 0.6); border: 2px solid #64748b;
            border-radius: 8px; display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: white; font-size: 14px; text-shadow: 1px 1px 2px black;
            transition: background 0.5s ease, border-color 0.5s ease; cursor: pointer;
        }
        .zone.captured { border-color: white; box-shadow: 0 0 20px rgba(255,255,255,0.3); }

        /* Игрок (Точка) */
        .player-dot {
            position: absolute; width: 24px; height: 24px; border-radius: 50%;
            border: 3px solid white; box-shadow: 0 0 20px currentColor;
            transform: translate(-50%, -50%); transition: all 0.2s linear; pointer-events: none; z-index: 10;
        }

        /* Панель сверху */
        #hud {
            position: absolute; top: 20px; left: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.7); padding: 12px 16px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(4px);
            z-index: 10; border: 1px solid #334155;
        }
        .hud-item { text-align: center; font-size: 12px; color: #94a3b8; }
        .hud-item span { display: block; font-size: 18px; font-weight: bold; color: white; margin-top: 2px; }

        /* Кнопка СТАРТ и мусорка */
        #bottomControls {
            position: absolute; bottom: 30px; left: 0; right: 0;
            display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; padding: 0 20px;
        }
        #btnAction {
            padding: 16px 40px; border-radius: 50px; border: none;
            background: #22c55e; color: white; font-size: 20px; font-weight: bold;
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.4); cursor: pointer; flex: 1; max-width: 300px; transition: 0.2s;
        }
        #btnAction:disabled { opacity: 0.5; transform: scale(0.95); }
        #btnAction:active { transform: scale(0.95); }
        #btnTrash {
            width: 50px; height: 50px; border-radius: 50%; background: #334155;
            border: none; color: #94a3b8; font-size: 20px; display: flex; justify-content: center; align-items: center; cursor: pointer;
        }

        /* Таблица лидеров */
        #leaderboard {
            position: absolute; bottom: 100px; left: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.8); padding: 15px; border-radius: 12px;
            backdrop-filter: blur(4px); z-index: 10; display: none; border: 1px solid #334155;
        }
        #leaderboard h3 { color: #facc15; margin-bottom: 10px; font-size: 16px; }
        .lb-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1e293b; font-size: 14px; }
        .lb-item:last-child { border-bottom: none; }

        /* Кнопка открытия таблицы */
        #btnLeaderboard {
            position: absolute; bottom: 100px; right: 20px; z-index: 10;
            background: #1e293b; border: 1px solid #334155; color: white;
            padding: 10px 15px; border-radius: 12px; font-size: 14px; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- РЕГИСТРАЦИЯ -->
    <div id="registerModal">
        <div class="reg-box">
            <h2>🏁 Вход в игру</h2>
            <input type="text" id="playerNameInput" class="reg-input" placeholder="Твой никнейм" maxlength="12">
            <p style="color: #94a3b8; margin-bottom: 10px; font-size: 14px;">Выбери цвет маркера:</p>
            <div class="palette" id="colorPalette">
                <div class="c-block" style="background: #ef4444;" data-color="#ef4444" onclick="pickColor(this)"></div>
                <div class="c-block" style="background: #3b82f6;" data-color="#3b82f6" onclick="pickColor(this)"></div>
                <div class="c-block" style="background: #22c55e;" data-color="#22c55e" onclick="pickColor(this)"></div>
                <div class="c-block" style="background: #eab308;" data-color="#eab308" onclick="pickColor(this)"></div>
                <div class="c-block" style="background: #a855f7;" data-color="#a855f7" onclick="pickColor(this)"></div>
            </div>
            <button class="btn-start-game" onclick="registerPlayer()">Начать игру</button>
        </div>
    </div>

    <!-- ИГРА -->
    <div id="gameContainer">
        <div id="mapCanvas"></div>

        <!-- HUD -->
        <div id="hud">
            <div class="hud-item">Твои зоны<span id="playerScore">0</span></div>
            <div class="hud-item">⏳ 24ч<span id="timerDisplay">00:00</span></div>
        </div>

        <!-- Кнопки -->
        <div id="bottomControls">
            <button id="btnTrash" onclick="resetGame()">🗑️</button>
            <button id="btnAction" onclick="startCapture()">🏃 СТАРТ</button>
        </div>

        <button id="btnLeaderboard" onclick="toggleLeaderboard()">🏆 Таблица</button>
        <div id="leaderboard">
            <h3>Турнирная таблица</h3>
            <div id="lbContent"><div style="color:#64748b; text-align:center;">Пока никого нет</div></div>
        </div>
    </div>

    <script>
        // --- ДАННЫЕ ИГРОКА ---
        let player = { name: '', color: '#ef4444', score: 0 };
        let capturedZones = {}; // { zoneId: { playerName, color, timestamp } }
        let isCapturing = false;
        let leaderboardData = [];

        // --- КОНФИГУРАЦИЯ ЗОН (Имитация карты Нячанга) ---
        const zones = [
            { id: 8, x: 30, y: 15, w: 50, h: 40 },
            { id: 9, x: 40, y: 25, w: 55, h: 45 },
            { id: 10, x: 20, y: 35, w: 60, h: 40 },
            { id: 11, x: 55, y: 40, w: 50, h: 40 },
            { id: 12, x: 25, y: 55, w: 60, h: 45 },
            { id: 13, x: 65, y: 50, w: 55, h: 40 },
            { id: 14, x: 45, y: 65, w: 50, h: 40 },
            { id: 15, x: 10, y: 70, w: 60, h: 45 },
            { id: 16, x: 70, y: 70, w: 50, h: 40 },
            { id: 17, x: 30, y: 80, w: 50, h: 40 },
            { id: 18, x: 55, y: 85, w: 60, h: 45 },
            { id: 19, x: 15, y: 90, w: 50, h: 40 },
            { id: 20, x: 75, y: 90, w: 50, h: 40 },
            { id: 21, x: 40, y: 95, w: 55, h: 40 },
            { id: 22, x: 60, y: 95, w: 50, h: 40 }
        ];

        // --- ОБЪЯВЛЕНИЕ ФУНКЦИЙ ---

        // 1. Регистрация
        function pickColor(el) {
            document.querySelectorAll('.c-block').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            player.color = el.getAttribute('data-color');
        }

        function registerPlayer() {
            const name = document.getElementById('playerNameInput').value.trim();
            if (!name) { alert('Введи никнейм!'); return; }
            player.name = name;
            document.getElementById('registerModal').style.display = 'none';
            document.getElementById('gameContainer').style.display = 'block';
            initGame();
        }

        // 2. Инициализация игры
        function initGame() {
            renderMap();
            updateHUD();
            simulateOtherPlayers();
            // Таймер 24ч
            setInterval(updateTimer, 1000);
            // Движение игрока (для теста)
            setInterval(movePlayer, 3000);
        }

        // 3. Отрисовка карты
        function renderMap() {
            const map = document.getElementById('mapCanvas');
            map.innerHTML = '';
            // Отрисовать зоны
            zones.forEach(z => {
                const div = document.createElement('div');
                div.className = 'zone';
                div.id = `zone-${z.id}`;
                div.style.left = z.x + '%'; div.style.top = z.y + '%';
                div.style.width = z.w + 'px'; div.style.height = z.h + 'px';
                div.innerText = z.id;
                map.appendChild(div);
            });
            // Отрисовать игрока
            const dot = document.createElement('div');
            dot.id = 'playerDot';
            dot.className = 'player-dot';
            dot.style.color = player.color;
            dot.style.background = player.color;
            dot.style.left = '50%'; dot.style.top = '50%';
            map.appendChild(dot);
        }

        // 4. Движение игрока (Симуляция для теста)
        let pX = 50, pY = 50;
        function movePlayer() {
            if (isCapturing) return;
            pX += (Math.random() - 0.5) * 4;
            pY += (Math.random() - 0.5) * 4;
            pX = Math.max(5, Math.min(95, pX));
            pY = Math.max(5, Math.min(95, pY));
            document.getElementById('playerDot').style.left = pX + '%';
            document.getElementById('playerDot').style.top = pY + '%';
            checkZoneProximity();
        }

        // 5. Проверка близости к зоне
        function checkZoneProximity() {
            let inZone = false;
            zones.forEach(z => {
                const el = document.getElementById(`zone-${z.id}`);
                const rect = el.getBoundingClientRect();
                const mapRect = document.getElementById('mapCanvas').getBoundingClientRect();
                // Простая проверка пересечения (для теста)
                const cx = mapRect.left + (pX/100) * mapRect.width;
                const cy = mapRect.top + (pY/100) * mapRect.height;
                if (cx > rect.left && cx < rect.right && cy > rect.top && cy < rect.bottom) {
                    inZone = true;
                    if (!capturedZones[z.id]) {
                        document.getElementById('btnAction').style.background = '#facc15';
                        document.getElementById('btnAction').innerText = '⚔️ ЗАХВАТИТЬ';
                    } else {
                        document.getElementById('btnAction').disabled = true;
                        document.getElementById('btnAction').innerText = 'Занято';
                    }
                }
            });
            if (!inZone) {
                document.getElementById('btnAction').style.background = '#22c55e';
                document.getElementById('btnAction').innerText = '🏃 СТАРТ';
                document.getElementById('btnAction').disabled = false;
                isCapturing = false;
            }
        }

        // 6. Захват зоны
        function startCapture() {
            if (isCapturing || document.getElementById('btnAction').disabled) return;
            isCapturing = true;
            document.getElementById('btnAction').innerText = '⏳ Захват...';
            
            setTimeout(() => {
                // Находим ближайшую зону (для теста берем первую свободную рядом)
                let targetZone = null;
                for(let z of zones) {
                    if(!capturedZones[z.id]) {
                        const el = document.getElementById(`zone-${z.id}`);
                        const rect = el.getBoundingClientRect();
                        const mapRect = document.getElementById('mapCanvas').getBoundingClientRect();
                        const cx = mapRect.left + (pX/100) * mapRect.width;
                        const cy = mapRect.top + (pY/100) * mapRect.height;
                        if (cx > rect.left && cx < rect.right && cy > rect.top && cy < rect.bottom) {
                            targetZone = z; break;
                        }
                    }
                }

                if (targetZone) {
                    capturedZones[targetZone.id] = {
                        playerName: player.name,
                        color: player.color,
                        timestamp: Date.now()
                    };
                    player.score++;
                    updateZoneVisual(targetZone.id);
                    updateHUD();
                    updateLeaderboard();
                    document.getElementById('btnAction').innerText = '✅ Захвачено!';
                    setTimeout(() => {
                        document.getElementById('btnAction').innerText = '🏃 СТАРТ';
                        isCapturing = false;
                        checkZoneProximity();
                    }, 1500);
                } else {
                    document.getElementById('btnAction').innerText = '❌ Вне зоны';
                    isCapturing = false;
                    setTimeout(() => {
                        document.getElementById('btnAction').innerText = '🏃 СТАРТ';
                    }, 1000);
                }
            }, 2000); // Имитация скорости
        }

        // 7. Обновление визуала зоны
        function updateZoneVisual(zoneId) {
            const el = document.getElementById(`zone-${zoneId}`);
            const data = capturedZones[zoneId];
            el.style.background = data.color;
            el.style.borderColor = 'white';
            el.classList.add('captured');
            el.innerText = zoneId + '\n' + data.playerName;
        }

        // 8. Обновление HUD
        function updateHUD() {
            document.getElementById('playerScore').innerText = player.score;
        }

        // 9. Таймер
        function updateTimer() {
            const t = new Date();
            document.getElementById('timerDisplay').innerText = 
                String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
        }

        // 10. Симуляция других игроков (для теста на ПК)
        function simulateOtherPlayers() {
            leaderboardData = [
                { name: 'Иван', score: 2 },
                { name: 'Петр', score: 1 },
                { name: player.name, score: 0 }
            ];
            // Захват пары зон ботами для визуала
            setTimeout(() => {
                capturedZones[8] = { playerName: 'Иван', color: '#3b82f6', timestamp: Date.now() };
                updateZoneVisual(8);
                capturedZones[16] = { playerName: 'Петр', color: '#22c55e', timestamp: Date.now() };
                updateZoneVisual(16);
                updateLeaderboard();
            }, 500);
        }

        // 11. Лидерборд
        function toggleLeaderboard() {
            const el = document.getElementById('leaderboard');
            el.style.display = el.style.display === 'none' ? 'block' : 'none';
            updateLeaderboard();
        }

        function updateLeaderboard() {
            const lb = document.getElementById('lbContent');
            // Собираем данные из захваченных зон
            let scores = {};
            Object.values(capturedZones).forEach(z => {
                if(!scores[z.playerName]) scores[z.playerName] = 0;
                scores[z.playerName]++;
            });
            // Добавляем текущего игрока
            if(!scores[player.name]) scores[player.name] = 0;
            
            let sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
            
            if(sorted.length === 0) {
                lb.innerHTML = '<div style="color:#64748b; text-align:center;">Пока никого нет</div>';
                return;
            }
            lb.innerHTML = sorted.map(([name, score], i) => 
                `<div class="lb-item">
                    <span>${i+1}. ${name}</span>
                    <span style="font-weight:bold; color:#facc15;">${score}</span>
                </div>`
            ).join('');
        }

        // 12. Сброс (мусорка)
        function resetGame() {
            if(confirm('Сбросить прогресс?')) {
                capturedZones = {};
                player.score = 0;
                document.querySelectorAll('.zone').forEach(el => {
                    el.style.background = 'rgba(100, 116, 139, 0.6)';
                    el.style.borderColor = '#64748b';
                    el.classList.remove('captured');
                    el.innerText = el.id.replace('zone-', '');
                });
                updateHUD();
                updateLeaderboard();
            }
        }

        // Вызов регистрации при старте (всё уже в HTML)
    </script>
</body>
</html>
