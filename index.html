<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🏃 Нячанг — Стратегия</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, Arial, sans-serif; background: #0f0f1a; }
    #map { height: 100vh; width: 100vw; }
    
    .info-panel {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 10px 16px;
      border-radius: 14px;
      display: flex;
      justify-content: space-around;
      z-index: 1000;
      font-size: 12px;
      backdrop-filter: blur(12px);
      flex-wrap: wrap;
      gap: 6px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .badge-green { background: #2ecc71; border-radius: 20px; padding: 2px 12px; font-weight: bold; }
    .badge-yellow { background: #f1c40f; border-radius: 20px; padding: 2px 12px; font-weight: bold; color: #1a1a2e; }
    .badge-gray { background: #555; border-radius: 20px; padding: 2px 12px; }
    .badge-red { background: #e74c3c; border-radius: 20px; padding: 2px 12px; font-weight: bold; }
    
    .controls {
      position: fixed;
      bottom: 40px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 1000;
    }
    
    button {
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      color: white;
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      box-shadow: 0 4px 20px rgba(46,204,113,0.3);
      cursor: pointer;
      transition: 0.3s;
      min-width: 140px;
    }
    button:active { transform: scale(0.95); }
    .stop-btn { background: linear-gradient(135deg, #e74c3c, #c0392b); }
    .reset-btn {
      background: linear-gradient(135deg, #555, #333);
      min-width: 56px;
      padding: 16px 18px;
    }
    
    .stats {
      position: fixed;
      bottom: 120px;
      right: 16px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 12px;
      z-index: 1000;
      backdrop-filter: blur(10px);
      max-width: 190px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .stats h4 { margin-bottom: 6px; border-bottom: 1px solid #444; padding-bottom: 4px; }
    .stat-item { padding: 3px 0; border-bottom: 1px solid #2a2a2a; font-size: 11px; }

    .zone-label {
      background: rgba(0,0,0,0.8);
      color: white;
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 18px;
      font-weight: bold;
      border: 2px solid rgba(255,255,255,0.3);
      text-align: center;
      pointer-events: none;
      font-family: monospace;
      text-shadow: 0 0 12px rgba(0,0,0,0.9);
    }
    .zone-label.captured {
      background: rgba(46,204,113,0.9);
      border-color: #2ecc71;
    }
    .zone-label.vulnerable {
      background: rgba(241,196,15,0.9);
      border-color: #f1c40f;
      color: #1a1a2e;
    }
    .zone-label.other {
      background: rgba(231,76,60,0.9);
      border-color: #e74c3c;
    }
    .zone-label.free {
      background: rgba(100,100,100,0.7);
      border-color: #666;
    }
    .zone-label.highlight {
      box-shadow: 0 0 30px rgba(255,255,255,0.5);
      border-color: #fff;
      transform: scale(1.1);
      z-index: 999;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="info-panel" id="infoPanel">
    <span id="zoneCount">🏛️ Зон: 0/8</span>
    <span id="capturedCount">✅ Захвачено: 0</span>
    <span id="totalPoints">⭐ Очков: 0</span>
  </div>

  <div class="stats" id="statsPanel">
    <h4>📊 Статистика</h4>
    <div id="statsContent">Кликни на зону</div>
  </div>

  <div class="controls">
    <button class="reset-btn" id="resetBtn">🗑️</button>
    <button id="actionBtn">🏃 СТАРТ</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ============================================================
    // КОНСТАНТЫ
    // ============================================================
    const PROTECTION_HOURS = 24;
    const STEAL_THRESHOLD = 0.8;

    // ============================================================
    // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================
    function calcPerimeter(coords) {
      if (coords.length < 2) return 0;
      let total = 0;
      for (let i = 0; i < coords.length - 1; i++) {
        total += map.distance(coords[i], coords[i + 1]);
      }
      total += map.distance(coords[coords.length - 1], coords[0]);
      return Math.round(total);
    }

    function getDaysSince(timestamp) {
      const now = Date.now();
      const diff = now - timestamp;
      return diff / (1000 * 60 * 60 * 24);
    }

    function getHoursSince(timestamp) {
      const now = Date.now();
      const diff = now - timestamp;
      return diff / (1000 * 60 * 60);
    }

    function isProtected(zone) {
      if (!zone.capturedAt) return false;
      return getHoursSince(zone.capturedAt) < PROTECTION_HOURS;
    }

    function getPoints(zone) {
      if (!zone.capturedAt) return 0;
      const days = Math.floor(getDaysSince(zone.capturedAt));
      return days * Math.round(calcPerimeter(zone.coords) / 100);
    }

    // ============================================================
    // ЗОНЫ
    // ============================================================
    const zonesData = [
      {
        id: '01', name: 'Vĩnh Hải', sector: 'Север',
        coords: [

          [12.2923235, 109.2125609], [12.2921000, 109.2110000],
          [12.2924772, 109.2094382], [12.2941344, 109.2126608],
          [12.2956220, 109.2136707], [12.2972075, 109.2161775],
          [12.2974191, 109.2184759]
        ]
      },
      {

        coords: [
          [12.2962654, 109.2213002], [12.2975950, 109.2203373],
          [12.2988297, 109.2173041], [12.3000696, 109.2144103],
          [12.3014942, 109.2096397], [12.3018978, 109.2077447],
          [12.2956413, 109.2114488], [12.2964750, 109.2124100],
          [12.2968203, 109.2131564], [12.2967479, 109.2152532],
          [12.2971500, 109.2162000], [12.2974244, 109.2175213],
          [12.2973589, 109.2189271]
        ]
      },
      {
        id: '03', name: 'Vĩnh Thọ', sector: 'Север',
        coords: [
          [12.2914859, 109.2075150], [12.2912536, 109.2084384],
          [12.2917984, 109.2089302], [12.2922606, 109.2084846],
          [12.2931818, 109.2109171], [12.2940797, 109.2125334],
          [12.2955172, 109.2135550], [12.2968118, 109.2152143],
          [12.2968213, 109.2131128], [12.2964505, 109.2123748],
          [12.2956027, 109.2114357], [12.3019142, 109.2077219],
          [12.3014104, 109.2068485], [12.2978892, 109.2080789],
          [12.2922718, 109.2081903]
        ]
      },
      {
        id: '04', name: 'Vĩnh Trường', sector: 'Север',
        coords: [
          [12.2895295, 109.2063285], [12.2902070, 109.2051047],
          [12.2901680, 109.2047996], [12.2899577, 109.2045381],
          [12.2892216, 109.2041542], [12.2884819, 109.2037324],
          [12.2883554, 109.1967339], [12.2824321, 109.1967758],
          [12.2822595, 109.2030605]
        ]
      },
      {
        id: '05', name: 'Vĩnh Lương', sector: 'Север',
        coords: [
          [12.2884429, 109.1998902], [12.2895429, 109.1998841],
          [12.2896487, 109.1997809], [12.2897418, 109.1989205],
          [12.2899845, 109.1976820], [12.2902302, 109.1945603],
          [12.2900589, 109.1939994], [12.2900920, 109.1936098],
          [12.2902066, 109.1924993], [12.2880602, 109.1924303],
          [12.2881156, 109.1902205], [12.2879593, 109.1900780],
          [12.2817805, 109.1939487], [12.2824472, 109.1958109],
          [12.2824606, 109.1968197], [12.2840256, 109.1966400],
          [12.2884085, 109.1967298]
        ]
      },
      {
        id: '06', name: 'Vĩnh Phương', sector: 'Север',
        coords: [
          [12.2745558, 109.2022746], [12.2764559, 109.2021013],
          [12.2784956, 109.2028926], [12.2801910, 109.2026491],
          [12.2822555, 109.2026347], [12.2824691, 109.1958719],
          [12.2817608, 109.1939591], [12.2754475, 109.1978534],
          [12.2742291, 109.1981849]
        ]
      },
      {
        id: '07', name: 'Vĩnh Thạnh', sector: 'Север',
        coords: [
          [12.2746085, 109.2022800], [12.2698640, 109.2057089],
          [12.2685552, 109.2058396], [12.2667588, 109.2045465],
          [12.2663244, 109.2034632], [12.2661799, 109.2015518],
          [12.2679763, 109.1971094], [12.2682076, 109.1968626],
          [12.2698722, 109.1978044], [12.2710339, 109.1980485],
          [12.2742337, 109.1981575]
        ]
      },
      {
        id: '08', name: 'Vĩnh Thái', sector: 'Север',
        coords: [
          [12.2703839, 109.1979989], [12.2697664, 109.1990650],
          [12.2697185, 109.1993809], [12.2690600, 109.1999985],
          [12.2686977, 109.2005969], [12.2701078, 109.2026364],
          [12.2705802, 109.2043876], [12.2710690, 109.2056284],
          [12.2715673, 109.2059640], [12.2719417, 109.2058929],
          [12.2720574, 109.2057049], [12.2720541, 109.2055121],
          [12.2718232, 109.2050165], [12.2718159, 109.2048476],
          [12.2720846, 109.2045321], [12.2720698, 109.2044251],
          [12.2718949, 109.2042132], [12.2698168, 109.2057464],
          [12.2683904, 109.2057833], [12.2667975, 109.2046417],
          [12.2663391, 109.2035896], [12.2659362, 109.2015515],
          [12.2648750, 109.2002932], [12.2642106, 109.1993822],
          [12.2641798, 109.1990265], [12.2644101, 109.1979023],
          [12.2644763, 109.1966229], [12.2651882, 109.1964318],
          [12.2656610, 109.1963335], [12.2681830, 109.1968831]
        ]
      }
    ];

    // ============================================================
    // СОСТОЯНИЕ
    // ============================================================
    let highlightedZone = null;
    let highlightLayer = null;

    function loadState() {
      try {
        const saved = localStorage.getItem('runningGameState');
        if (saved) {
          const parsed = JSON.parse(saved);
          zonesData.forEach(z => {
            const found = parsed.find(p => p.id === z.id);
            if (found) {
              z.capturedAt = found.capturedAt;
              z.owner = found.owner || 'me';
            }
          });
        }
      } catch (e) {}
    }

    function saveState() {
      try {
        const state = zonesData.map(z => ({
          id: z.id,
          capturedAt: z.capturedAt || null,
          owner: z.owner || null
        }));
        localStorage.setItem('runningGameState', JSON.stringify(state));
      } catch (e) {}
    }

    // ============================================================
    // КАРТА
    // ============================================================
    const map = L.map('map', {
      center: [12.280, 109.208],
      zoom: 14,
      zoomControl: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // ============================================================
    // СОСТОЯНИЕ
    // ============================================================
    let capturedZones = new Set();
    let isRunning = false;
    let route = [];
    let watchId = null;
    let polyline = null;
    let zoneLayers = [];
    let labelLayers = [];

    const zoneCountSpan = document.getElementById('zoneCount');
    const capturedCountSpan = document.getElementById('capturedCount');
    const totalPointsSpan = document.getElementById('totalPoints');
    const statsContent = document.getElementById('statsContent');
    const actionBtn = document.getElementById('actionBtn');
    const resetBtn = document.getElementById('resetBtn');

    // ============================================================
    // РИСОВАНИЕ ЗОН
    // ============================================================
    function drawZones() {
      zoneLayers.forEach(l => map.removeLayer(l));
      labelLayers.forEach(l => map.removeLayer(l));
      zoneLayers = [];
      labelLayers = [];

      zonesData.forEach((zone) => {
        const isMine = zone.owner === 'me';
        const isCaptured = !!zone.capturedAt;
        const protected_ = isProtected(zone);
        const perimeter = calcPerimeter(zone.coords);
        const points = getPoints(zone);
        const isHighlighted = highlightedZone === zone.id;

        let color, fillColor, fillOpacity, weight, labelClass;

        if (!isCaptured) {
          color = isHighlighted ? '#aaa' : '#666';
          fillColor = isHighlighted ? 'rgba(150,150,150,0.25)' : 'rgba(100,100,100,0.05)';
          fillOpacity = isHighlighted ? 0.25 : 0.05;
          weight = isHighlighted ? 5 : 2;
          labelClass = 'free';
        } else if (isMine) {
          if (protected_) {
            color = isHighlighted ? '#6ee7b9' : '#2ecc71';
            fillColor = isHighlighted ? 'rgba(46,204,113,0.5)' : 'rgba(46,204,113,0.25)';
            fillOpacity = isHighlighted ? 0.5 : 0.25;
            weight = isHighlighted ? 5 : 4;
            labelClass = 'captured';
          } else {
            color = isHighlighted ? '#f5d742' : '#f1c40f';
            fillColor = isHighlighted ? 'rgba(241,196,15,0.5)' : 'rgba(241,196,15,0.25)';
            fillOpacity = isHighlighted ? 0.5 : 0.25;
            weight = isHighlighted ? 5 : 4;
            labelClass = 'vulnerable';
          }
        } else {
          color = isHighlighted ? '#ff6b6b' : '#e74c3c';
          fillColor = isHighlighted ? 'rgba(231,76,60,0.4)' : 'rgba(231,76,60,0.2)';
          fillOpacity = isHighlighted ? 0.4 : 0.2;
          weight = isHighlighted ? 5 : 3;
          labelClass = 'other';
        }

        if (isHighlighted) {
          labelClass += ' highlight';
        }

        const polygon = L.polygon(zone.coords, {
          color: color,
          weight: weight,
          opacity: 1,
          fillColor: fillColor,
          fillOpacity: fillOpacity,
          interactive: true,
          smoothFactor: 1,
          dashArray: !isCaptured ? '5, 5' : null,
          className: isHighlighted ? 'highlighted-zone' : ''
        });

        polygon.bindPopup(`
          <b>🏛️ Зона ${zone.id}</b><br>
          ${zone.name}<br>
          📍 ${zone.sector}<br>
          📏 Периметр: ${perimeter} м<br>
          ${isCaptured ? `👤 Владелец: ${isMine ? 'Ты' : 'Другой игрок'}` : '⬜ Свободна'}<br>
          ${isCaptured ? `🛡️ ${protected_ ? '✅ Защищена' : '⚠️ Уязвима'}` : ''}<br>
          ${isCaptured && isMine ? `⭐ Очков: ${points}` : ''}
          ${!isCaptured ? '🏃 Нажми СТАРТ, чтобы захватить!' : ''}
        `);

        polygon.on('click', () => {
          // Подсветка при клике
          if (highlightedZone === zone.id) {
            highlightedZone = null;
          } else {
            highlightedZone = zone.id;
          }
          drawZones();

          let statusText = '';
          if (!isCaptured) {
            statusText = '⬜ Свободна';
          } else if (isMine && protected_) {
            statusText = '🛡️ Защищена';
          } else if (isMine && !protected_) {
            statusText = '⚠️ Уязвима';
          } else {
            statusText = '👤 Занята другим игроком';
          }

          statsContent.innerHTML = `
            <div class="stat-item">🏛️ Зона ${zone.id}</div>
            <div class="stat-item">📍 ${zone.name}</div>
            <div class="stat-item">📐 Сектор: ${zone.sector}</div>
            <div class="stat-item">📏 Периметр: ${perimeter} м</div>
            <div class="stat-item" style="border-bottom:none;color:${isCaptured ? (isMine ? (protected_ ? '#2ecc71' : '#f1c40f') : '#e74c3c') : '#888'};">
              ${statusText}
            </div>
            ${isCaptured && isMine ? `<div class="stat-item" style="border-bottom:none;color:#f1c40f;">⭐ Очков: ${points}</div>` : ''}
          `;
        });

        polygon.addTo(map);
        zoneLayers.push(polygon);

        const center = zone.coords.reduce(
          (acc, p) => [acc[0] + p[0] / zone.coords.length, acc[1] + p[1] / zone.coords.length],
          [0, 0]
        );

        let labelHtml = zone.id;
        if (isCaptured && isMine && protected_) {
          labelHtml += ' 🔒';
        } else if (isCaptured && isMine && !protected_) {
          labelHtml += ' ⚠️';
        } else if (isCaptured && !isMine) {
          labelHtml += ' 🔴';
        }
        if (isHighlighted) {
          labelHtml += ' ✨';
        }

        const label = L.marker(center, {
          icon: L.divIcon({
            className: `zone-label ${labelClass}`,
            html: labelHtml,
            iconSize: [isHighlighted ? 58 : 50, isHighlighted ? 40 : 34],
            iconAnchor: [isHighlighted ? 29 : 25, isHighlighted ? 20 : 17]
          }),
          interactive: false
        });
        label.addTo(map);
        labelLayers.push(label);
      });

      updateUI();
    }

    // ============================================================
    // ПРОВЕРКА ОТБОРА
    // ============================================================
    function checkSteal(zone, points) {
      if (zone.owner === 'me') return false;
      if (!zone.capturedAt) return false;
      if (isProtected(zone)) return false;
      if (points.length < 5) return false;

      const perimeter = calcPerimeter(zone.coords);
      if (perimeter === 0) return false;

      let covered = 0;
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        let minDist = Infinity;
        for (let j = 0; j < zone.coords.length; j++) {
          const d = map.distance(p, zone.coords[j]);
          if (d < minDist) minDist = d;
        }
        if (minDist < 20) {
          covered++;
        }
      }

      const coverage = covered / points.length;
      return coverage >= STEAL_THRESHOLD;
    }

    // ============================================================
    // ЗАХВАТ ЗОНЫ
    // ============================================================
    function captureZone(zoneId) {
      const zone = zonesData.find(z => z.id === zoneId);
      if (!zone) return;

      if (zone.capturedAt) {
        if (zone.owner === 'me') {
          alert('❌ Это твоя зона!');
          return;
        }
        if (isProtected(zone)) {
          alert('🛡️ Зона защищена! Подожди 24 часа.');
          return;
        }
        if (route.length < 5) {
          alert('❌ Слишком короткий маршрут для отбора');
          return;
        }
        if (!checkSteal(zone, route)) {
          alert('❌ Нужно пробежать ≥ 80% периметра зоны!');
          return;
        }
        alert(`✅ Зона ${zone.id} отобрана!`);
      } else {
        alert(`✅ Зона ${zone.id} захвачена!`);
      }

      zone.capturedAt = Date.now();
      zone.owner = 'me';
      capturedZones.add(zone.id);
      saveState();
      highlightedZone = zone.id;
      drawZones();
      updateUI();
    }

    // ============================================================
    // ОБНОВЛЕНИЕ UI
    // ============================================================
    function updateUI() {
      const total = zonesData.length;
      const captured = zonesData.filter(z => z.owner === 'me').length;
      const totalPoints = zonesData
        .filter(z => z.owner === 'me')
        .reduce((sum, z) => sum + getPoints(z), 0);

      zoneCountSpan.textContent = `🏛️ Зон: ${captured}/${total}`;
      capturedCountSpan.textContent = `✅ Захвачено: ${captured}`;
      totalPointsSpan.textContent = `⭐ Очков: ${totalPoints}`;
    }

    // ============================================================
    // БЕГ
    // ============================================================
    function startRun() {
      route = [];
      isRunning = true;
      actionBtn.textContent = '⏹ СТОП';
      actionBtn.className = 'stop-btn';
      if (polyline) { map.removeLayer(polyline); polyline = null; }

      navigator.geolocation.getCurrentPosition(
        pos => {
          route.push([pos.coords.latitude, pos.coords.longitude]);
          updateUI();
        },
        () => {},
        { enableHighAccuracy: true }
      );

      watchId = navigator.geolocation.watchPosition(
        pos => {
          const p = [pos.coords.latitude, pos.coords.longitude];
          route.push(p);
          if (polyline) map.removeLayer(polyline);
          polyline = L.polyline(route, { color: '#e74c3c', weight: 4, opacity: 0.9 }).addTo(map);
          map.setView(p, 15);
          updateUI();
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 2000 }
      );
    }

    function stopRun() {
      if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      isRunning = false;
      actionBtn.textContent = '🏃 СТАРТ';
      actionBtn.className = '';

      if (route.length < 5) {
        alert('❌ Слишком короткий маршрут');
        return;
      }

      const first = route[0];
      const last = route[route.length - 1];
      if (map.distance(first, last) < 50) {
        let captured = false;
        for (const zone of zonesData) {
          if (zone.owner === 'me') continue;
          const center = zone.coords.reduce(
            (acc, p) => [acc[0] + p[0] / zone.coords.length, acc[1] + p[1] / zone.coords.length],
            [0, 0]
          );
          if (pointInPolygon(center, route)) {
            captureZone(zone.id);
            captured = true;
            break;
          }
        }
        if (!captured) {
          alert('❌ Маршрут не захватил ни одной зоны');
        }
      } else {
        alert('❌ Маршрут не замкнут! Вернись в старт (< 50 м)');
      }

      updateUI();
    }

    function pointInPolygon(point, polygon) {
      let inside = false;
      const x = point[1], y = point[0];
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const xi = polygon[i][1], yi = polygon[i][0];
        const xj = polygon[j][1], yj = polygon[j][0];
        const intersect = ((yi > y) !== (yj > y)) &&
          (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function resetGame() {
      if (isRunning) {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        isRunning = false;
        actionBtn.textContent = '🏃 СТАРТ';
        actionBtn.className = '';
      }
      if (confirm('Сбросить все зоны?')) {
        zonesData.forEach(z => {
          z.capturedAt = null;
          z.owner = null;
        });
        capturedZones.clear();
        route = [];
        highlightedZone = null;
        if (polyline) { map.removeLayer(polyline); polyline = null; }
        saveState();
        drawZones();
        updateUI();
        statsContent.innerHTML = '⬜ Кликни на зону';
      }
    }

    // ============================================================
    // КНОПКИ
    // ============================================================
    actionBtn.addEventListener('click', () => isRunning ? stopRun() : startRun());
    resetBtn.addEventListener('click', resetGame);

    // ============================================================
    // ГЕОЛОКАЦИЯ
    // ============================================================
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          map.setView([pos.coords.latitude, pos.coords.longitude], 14);
          L.marker([pos.coords.latitude, pos.coords.longitude])
            .addTo(map)
            .bindPopup('📍 Вы здесь');
        },
        () => {},
        { enableHighAccuracy: true }
      );
    }

    // ============================================================
    // ЗАПУСК
    // ============================================================
    loadState();
    drawZones();
    console.log('🏃 Стратегическая игра — подсветка зон при клике');
  </script>
</body>
</html>
