<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🏃 Нячанг — Зоны</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, Arial, sans-serif; background: #0f0f1a; }
    #map { height: 100vh; width: 100vw; }
    
    .info-panel {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 10px 16px;
      border-radius: 14px;
      display: flex;
      justify-content: space-around;
      z-index: 1000;
      font-size: 12px;
      backdrop-filter: blur(12px);
      flex-wrap: wrap;
      gap: 6px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .badge-green { background: #2ecc71; border-radius: 20px; padding: 2px 12px; font-weight: bold; }
    .badge-gray { background: #555; border-radius: 20px; padding: 2px 12px; }
    
    .controls {
      position: fixed;
      bottom: 40px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 1000;
    }
    
    button {
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      color: white;
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      box-shadow: 0 4px 20px rgba(46,204,113,0.3);
      cursor: pointer;
      transition: 0.3s;
      min-width: 140px;
    }
    button:active { transform: scale(0.95); }
    .reset-btn {
      background: linear-gradient(135deg, #555, #333);
      min-width: 56px;
      padding: 16px 18px;
    }
    
    .stats {
      position: fixed;
      bottom: 120px;
      right: 16px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 12px;
      z-index: 1000;
      backdrop-filter: blur(10px);
      max-width: 190px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .stats h4 { margin-bottom: 6px; border-bottom: 1px solid #444; padding-bottom: 4px; }
    .stat-item { padding: 3px 0; border-bottom: 1px solid #2a2a2a; font-size: 11px; }

    .zone-label {
      background: rgba(0,0,0,0.8);
      color: white;
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 18px;
      font-weight: bold;
      border: 2px solid rgba(255,255,255,0.3);
      text-align: center;
      pointer-events: none;
      font-family: monospace;
      text-shadow: 0 0 12px rgba(0,0,0,0.9);
    }
    .zone-label.captured {
      background: rgba(46,204,113,0.9);
      border-color: #2ecc71;
    }
    .point-label {
      background: rgba(0,0,0,0.7);
      color: white;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      border: 2px solid #f1c40f;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="info-panel" id="infoPanel">
    <span id="zoneCount">🏛️ Зон: 0/7</span>
    <span id="capturedCount">✅ Захвачено: 0</span>
    <span id="totalDistance">📏 Всего: 0 м</span>
  </div>

  <div class="stats" id="statsPanel">
    <h4>📊 Статистика</h4>
    <div id="statsContent">Кликни на зону</div>
  </div>

  <div class="controls">
    <button class="reset-btn" id="resetBtn">🗑️</button>
    <button id="actionBtn">🏃 СТАРТ</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ============================================================
    // РАСЧЁТ ПЕРИМЕТРА
    // ============================================================
    function calcPerimeter(coords) {
      if (coords.length < 3) return 0;
      let total = 0;
      for (let i = 0; i < coords.length - 1; i++) {
        total += map.distance(coords[i], coords[i + 1]);
      }
      total += map.distance(coords[coords.length - 1], coords[0]);
      return Math.round(total);
    }

    // ============================================================
    // 7 ЗОН — ВСЕ В СЕВЕРНОМ СЕКТОРЕ
    // ============================================================
    const zonesData = [
      {
        id: '01',
        name: 'Vĩnh Hải',
        sector: 'Север',
        color: '#3498db',
        coords: [
          [12.2959054, 109.2216405],
          [12.2951267, 109.2177517],
          [12.2923235, 109.2125609],
          [12.2921000, 109.2110000],
          [12.2924772, 109.2094382],
          [12.2941344, 109.2126608],
          [12.2956220, 109.2136707],
          [12.2972075, 109.2161775],
          [12.2974191, 109.2184759]
        ]
      },
      {
        id: '02',
        name: 'Vĩnh Phước',
        sector: 'Север',
        color: '#e67e22',
        coords: [
          [12.2962654, 109.2213002],
          [12.2975950, 109.2203373],
          [12.2988297, 109.2173041],
          [12.3000696, 109.2144103],
          [12.3014942, 109.2096397],
          [12.3018978, 109.2077447],
          [12.2956413, 109.2114488],
          [12.2964750, 109.2124100],
          [12.2968203, 109.2131564],
          [12.2967479, 109.2152532],
          [12.2971500, 109.2162000],
          [12.2974244, 109.2175213],
          [12.2973589, 109.2189271]
        ]
      },
      {
        id: '03',
        name: 'Vĩnh Thọ',
        sector: 'Север',
        color: '#9b59b6',
        coords: [
          [12.2914859, 109.2075150],
          [12.2912536, 109.2084384],
          [12.2917984, 109.2089302],
          [12.2922606, 109.2084846],
          [12.2931818, 109.2109171],
          [12.2940797, 109.2125334],
          [12.2955172, 109.2135550],
          [12.2968118, 109.2152143],
          [12.2968213, 109.2131128],
          [12.2964505, 109.2123748],
          [12.2956027, 109.2114357],
          [12.3019142, 109.2077219],
          [12.3014104, 109.2068485],
          [12.2978892, 109.2080789],
          [12.2922718, 109.2081903]
        ]
      },
      {
        id: '04',
        name: 'Vĩnh Trường',
        sector: 'Север',
        color: '#1abc9c',
        coords: [
          [12.2895295, 109.2063285],
          [12.2902070, 109.2051047],
          [12.2901680, 109.2047996],
          [12.2899577, 109.2045381],
          [12.2892216, 109.2041542],
          [12.2884819, 109.2037324],
          [12.2883554, 109.1967339],
          [12.2824321, 109.1967758],
          [12.2822595, 109.2030605]
        ]
      },
      {
        id: '05',
        name: 'Vĩnh Lương',
        sector: 'Север',
        color: '#e74c3c',
        coords: [
          [12.2884429, 109.1998902],
          [12.2895429, 109.1998841],
          [12.2896487, 109.1997809],
          [12.2897418, 109.1989205],
          [12.2899845, 109.1976820],
          [12.2902302, 109.1945603],
          [12.2900589, 109.1939994],
          [12.2900920, 109.1936098],
          [12.2902066, 109.1924993],
          [12.2880602, 109.1924303],
          [12.2881156, 109.1902205],
          [12.2879593, 109.1900780],
          [12.2817805, 109.1939487],
          [12.2824472, 109.1958109],
          [12.2824606, 109.1968197],
          [12.2840256, 109.1966400],
          [12.2884085, 109.1967298]
        ]
      },
      {
        id: '06',
        name: 'Vĩnh Phương',
        sector: 'Север',
        color: '#f39c12',
        coords: [
          [12.2745558, 109.2022746],
          [12.2764559, 109.2021013],
          [12.2784956, 109.2028926],
          [12.2801910, 109.2026491],
          [12.2822555, 109.2026347],
          [12.2824691, 109.1958719],
          [12.2817608, 109.1939591],
          [12.2754475, 109.1978534],
          [12.2742291, 109.1981849]
        ]
      },
      {
        id: '07',
        name: 'Vĩnh Thạnh',
        sector: 'Север',
        color: '#2c3e50',
        coords: [
          [12.2746085, 109.2022800],
          [12.2698640, 109.2057089],
          [12.2685552, 109.2058396],
          [12.2667588, 109.2045465],
          [12.2663244, 109.2034632],
          [12.2661799, 109.2015518],
          [12.2679763, 109.1971094],
          [12.2682076, 109.1968626],
          [12.2698722, 109.1978044],
          [12.2710339, 109.1980485],
          [12.2742337, 109.1981575]
        ]
      }
    ];

    // ============================================================
    // КАРТА
    // ============================================================
    const map = L.map('map', {
      center: [12.280, 109.208],
      zoom: 14,
      zoomControl: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // ============================================================
    // СОСТОЯНИЕ
    // ============================================================
    let capturedZones = new Set();
    let zoneLayers = [];
    let labelLayers = [];
    let pointLayers = [];

    const zoneCountSpan = document.getElementById('zoneCount');
    const capturedCountSpan = document.getElementById('capturedCount');
    const totalDistanceSpan = document.getElementById('totalDistance');
    const statsContent = document.getElementById('statsContent');
    const actionBtn = document.getElementById('actionBtn');
    const resetBtn = document.getElementById('resetBtn');

    // ============================================================
    // РИСОВАНИЕ ЗОН
    // ============================================================
    function drawZones() {
      zoneLayers.forEach(l => map.removeLayer(l));
      labelLayers.forEach(l => map.removeLayer(l));
      pointLayers.forEach(l => map.removeLayer(l));
      zoneLayers = [];
      labelLayers = [];
      pointLayers = [];

      zonesData.forEach((zone) => {
        const isCaptured = capturedZones.has(zone.id);
        const perimeter = calcPerimeter(zone.coords);

        const polygon = L.polygon(zone.coords, {
          color: isCaptured ? '#2ecc71' : zone.color,
          weight: isCaptured ? 4 : 3,
          opacity: isCaptured ? 1 : 0.8,
          fillColor: isCaptured ? '#2ecc71' : zone.color,
          fillOpacity: isCaptured ? 0.35 : 0.12,
          interactive: true,
          smoothFactor: 1
        });

        polygon.bindPopup(`
          <b>🏛️ Зона ${zone.id}</b><br>
          ${zone.name}<br>
          📍 ${zone.sector}<br>
          📏 Периметр: ${perimeter} м<br>
          ${isCaptured ? '✅ Захвачена' : '⬜ Свободна'}
        `);

        polygon.on('click', () => {
          statsContent.innerHTML = `
            <div class="stat-item">🏛️ Зона ${zone.id}</div>
            <div class="stat-item">📍 ${zone.name}</div>
            <div class="stat-item">📐 Сектор: ${zone.sector}</div>
            <div class="stat-item" style="border-bottom:none;color:#f1c40f;">
              🏃 Периметр: ${perimeter} м
            </div>
          `;
        });

        polygon.addTo(map);
        zoneLayers.push(polygon);

        const center = zone.coords.reduce(
          (acc, p) => [acc[0] + p[0] / zone.coords.length, acc[1] + p[1] / zone.coords.length],
          [0, 0]
        );

        const label = L.marker(center, {
          icon: L.divIcon({
            className: `zone-label ${isCaptured ? 'captured' : ''}`,
            html: zone.id,
            iconSize: [44, 34],
            iconAnchor: [22, 17]
          }),
          interactive: false
        });
        label.addTo(map);
        labelLayers.push(label);

        // ТОЧКИ С НОМЕРАМИ
        zone.coords.forEach((p, i) => {
          const pointMarker = L.marker(p, {
            icon: L.divIcon({
              className: 'point-label',
              html: `${i + 1}`,
              iconSize: [22, 22],
              iconAnchor: [11, 11]
            }),
            interactive: false
          });
          pointMarker.addTo(map);
          pointLayers.push(pointMarker);
        });
      });

      updateUI();
    }

    // ============================================================
    // ОБНОВЛЕНИЕ UI
    // ============================================================
    function updateUI() {
      const total = zonesData.length;
      const captured = capturedZones.size;
      zoneCountSpan.textContent = `🏛️ Зон: ${captured}/${total}`;
      capturedCountSpan.textContent = `✅ Захвачено: ${captured}`;

      let totalPerimeter = 0;
      zonesData.forEach(z => {
        if (capturedZones.has(z.id)) {
          totalPerimeter += calcPerimeter(z.coords);
        }
      });
      totalDistanceSpan.textContent = `📏 Всего: ${totalPerimeter} м`;

      if (captured === 0) {
        statsContent.innerHTML = '⬜ Кликни на зону';
      }
    }

    // ============================================================
    // КНОПКИ
    // ============================================================
    actionBtn.addEventListener('click', () => {
      const available = zonesData.filter(z => !capturedZones.has(z.id));
      if (available.length > 0) {
        capturedZones.add(available[0].id);
        drawZones();
        updateUI();
        const perim = calcPerimeter(available[0].coords);
        statsContent.innerHTML = `
          <div class="stat-item">🏛️ Захвачена зона ${available[0].id}</div>
          <div class="stat-item">📍 ${available[0].name}</div>
          <div class="stat-item" style="border-bottom:none;color:#2ecc71;">
            🏃 Нужно пробежать: ${perim} м
          </div>
        `;
      } else {
        alert('🎉 Все зоны захвачены!');
      }
    });

    resetBtn.addEventListener('click', () => {
      capturedZones.clear();
      drawZones();
      statsContent.innerHTML = '⬜ Кликни на зону';
    });

    // ============================================================
    // ГЕОЛОКАЦИЯ
    // ============================================================
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          map.setView([pos.coords.latitude, pos.coords.longitude], 14);
          L.marker([pos.coords.latitude, pos.coords.longitude])
            .addTo(map)
            .bindPopup('📍 Вы здесь');
        },
        () => {},
        { enableHighAccuracy: true }
      );
    }

    // ============================================================
    // ЗАПУСК
    // ============================================================
    drawZones();
    console.log('🏃 7 зон — все замкнуты!');
  </script>
</body>
</html>
