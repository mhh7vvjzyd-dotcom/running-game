<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🏃 Нячанг — Стратегия</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, Arial, sans-serif; background: #0f0f1a; }
    #map { height: 100vh; width: 100vw; }
    
    .info-panel {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 10px 16px;
      border-radius: 14px;
      display: flex;
      justify-content: space-around;
      z-index: 1000;
      font-size: 11px;
      backdrop-filter: blur(12px);
      flex-wrap: wrap;
      gap: 4px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .badge-green { background: #2ecc71; border-radius: 20px; padding: 2px 12px; font-weight: bold; }
    .badge-yellow { background: #f1c40f; border-radius: 20px; padding: 2px 12px; font-weight: bold; color: #1a1a2e; }
    .badge-gray { background: #555; border-radius: 20px; padding: 2px 12px; }
    .badge-red { background: #e74c3c; border-radius: 20px; padding: 2px 12px; font-weight: bold; }
    
    .controls {
      position: fixed;
      bottom: 40px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 1000;
    }
    
    button {
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      color: white;
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      box-shadow: 0 4px 20px rgba(46,204,113,0.3);
      cursor: pointer;
      transition: 0.3s;
      min-width: 140px;
    }
    button:active { transform: scale(0.95); }
    .stop-btn { background: linear-gradient(135deg, #e74c3c, #c0392b); }
    .reset-btn {
      background: linear-gradient(135deg, #555, #333);
      min-width: 56px;
      padding: 16px 18px;
    }
    
    .stats {
      position: fixed;
      bottom: 120px;
      right: 16px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 12px;
      z-index: 1000;
      backdrop-filter: blur(10px);
      max-width: 190px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .stats h4 { margin-bottom: 6px; border-bottom: 1px solid #444; padding-bottom: 4px; }
    .stat-item { padding: 3px 0; border-bottom: 1px solid #2a2a2a; font-size: 11px; }

    .zone-label {
      background: rgba(0,0,0,0.8);
      color: white;
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 18px;
      font-weight: bold;
      border: 2px solid rgba(255,255,255,0.3);
      text-align: center;
      pointer-events: none;
      font-family: monospace;
      text-shadow: 0 0 12px rgba(0,0,0,0.9);
    }
    .zone-label.captured {
      background: rgba(46,204,113,0.9);
      border-color: #2ecc71;
    }
    .zone-label.vulnerable {
      background: rgba(241,196,15,0.9);
      border-color: #f1c40f;
      color: #1a1a2e;
    }
    .zone-label.other {
      background: rgba(231,76,60,0.9);
      border-color: #e74c3c;
    }
    .zone-label.free {
      background: rgba(100,100,100,0.7);
      border-color: #666;
    }

    .highlighted-zone {
      filter: drop-shadow(0 0 15px rgba(46, 204, 113, 0.8));
    }

    .leaderboard {
      position: fixed;
      left: 16px;
      bottom: 130px;
      background: rgba(0,0,0,0.88);
      color: white;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 12px;
      z-index: 1000;
      backdrop-filter: blur(10px);
      max-width: 200px;
      max-height: 260px;
      overflow-y: auto;
      border: 1px solid rgba(255,255,255,0.06);
      min-width: 160px;
    }
    .leaderboard h4 { margin-bottom: 6px; border-bottom: 1px solid #444; padding-bottom: 4px; font-size: 13px; text-align: center; }
    .lb-item { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #2a2a2a; font-size: 11px; align-items: center; }
    .lb-item .name { color: #aaa; }
    .lb-item .score { color: #f1c40f; font-weight: bold; }
    .lb-item.me .name { color: #2ecc71; font-weight: bold; }
    .lb-item.me .score { color: #2ecc71; }
    .lb-pos { color: #666; margin-right: 8px; font-weight: bold; }
    .lb-pos.top1 { color: #f1c40f; }
    .lb-pos.top2 { color: #c0c0c0; }
    .lb-pos.top3 { color: #cd7f32; }
    .leaderboard .empty { text-align: center; color: #555; padding: 8px 0; }
    .color-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      flex-shrink: 0;
    }

    .lang-switcher {
      position: fixed;
      top: 80px;
      right: 16px;
      z-index: 1000;
      display: flex;
      gap: 6px;
      flex-direction: column;
    }
    .lang-btn-small {
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.15);
      color: #888;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      transition: 0.3s;
      backdrop-filter: blur(8px);
      min-width: 36px;
      text-align: center;
    }
    .lang-btn-small:hover { background: rgba(255,255,255,0.1); }
    .lang-btn-small.active { 
      border-color: #2ecc71; 
      color: #2ecc71; 
      background: rgba(46,204,113,0.15);
      box-shadow: 0 0 15px rgba(46,204,113,0.15);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      padding: 16px;
    }
    .modal {
      background: #1a1a2e;
      padding: 28px 24px;
      border-radius: 20px;
      max-width: 380px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.08);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h2 { color: white; font-size: 20px; margin-bottom: 8px; text-align: center; }
    .modal p { color: #aaa; font-size: 14px; text-align: center; margin-bottom: 16px; }
    .modal input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: white;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
      text-align: center;
    }
    .modal input:focus { border-color: #2ecc71; background: rgba(46,204,113,0.08); }
    .modal button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .modal button:hover { transform: scale(0.98); }
    .modal .error { color: #e74c3c; font-size: 13px; text-align: center; margin-top: 10px; display: none; }
    
    .color-picker {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 12px 0 8px 0;
    }
    .color-option {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.15);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .color-option:hover { transform: scale(1.1); }
    .color-option.selected { 
      border-color: #fff; 
      box-shadow: 0 0 20px rgba(255,255,255,0.3);
      transform: scale(1.1);
    }
    .modal .color-label { color: #888; font-size: 12px; text-align: center; margin-bottom: 4px; }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="modal-overlay" id="nameModal">
    <div class="modal">
      <h2>🏃 Добро пожаловать!</h2>
      <p>Введите ваш игровой никнейм</p>
      <input type="text" id="usernameInput" placeholder="Например: AlexRunner" maxlength="20" />
      
      <div class="color-label">Выберите ваш цвет:</div>
      <div class="color-picker" id="colorPicker">
        <div class="color-option selected" style="background:#e74c3c" data-color="#e74c3c"></div>
        <div class="color-option" style="background:#2ecc71" data-color="#2ecc71"></div>
        <div class="color-option" style="background:#3498db" data-color="#3498db"></div>
        <div class="color-option" style="background:#f1c40f" data-color="#f1c40f"></div>
        <div class="color-option" style="background:#9b59b6" data-color="#9b59b6"></div>
        <div class="color-option" style="background:#e67e22" data-color="#e67e22"></div>
        <div class="color-option" style="background:#e84393" data-color="#e84393"></div>
        <div class="color-option" style="background:#ecf0f1" data-color="#ecf0f1"></div>
      </div>
      
      <button id="saveNameBtn">Продолжить</button>
      <div class="error" id="nameError">⚠️ Введите никнейм (минимум 2 символа)</div>
    </div>
  </div>

  <div class="lang-switcher">
    <button class="lang-btn-small active" data-lang="ru" id="langRu">🇷🇺</button>
    <button class="lang-btn-small" data-lang="en" id="langEn">🇬🇧</button>
    <button class="lang-btn-small" data-lang="vi" id="langVi">🇻🇳</button>
  </div>

  <div class="info-panel" id="infoPanel">
    <span id="playerDisplay">👤 Гость</span>
    <span id="zoneCount">🏛️ Зон: 0/22</span>
    <span id="capturedCount">✅ Захвачено: 0</span>
    <span id="totalPoints">⭐ Очков: 0</span>
    <span id="leaderboardToggle" style="cursor:pointer;color:#2ecc71;">📊 Таблица</span>
  </div>

  <div class="stats" id="statsPanel">
    <h4 id="statsTitle">📊 Статистика</h4>
    <div id="statsContent">Кликни на зону</div>
  </div>

  <div class="leaderboard" id="leaderboard">
    <h4 id="lbTitle">🏆 ТУРНИРНАЯ ТАБЛИЦА</h4>
    <div id="lbContent">Загрузка...</div>
  </div>

  <div class="controls">
    <button class="reset-btn" id="resetBtn">🗑️</button>
    <button id="actionBtn">🏃 СТАРТ</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ============================================================
    // SUPABASE НАСТРОЙКИ
    // ============================================================
    const SUPABASE_URL = 'https://onmcvmozceyatcmxmnnb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ubWN2bW96Y2V5YXRjbXhtbm5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2OTg0NTksImV4cCI6MjEwMjI3NDQ1OX0.WswNX824baDjb05JAm8EJhmpIvmztsaqLyP3x4kevOo';

    // ============================================================
    // ПЕРЕВОДЫ
    // ============================================================
    const LANG = {
      ru: {
        zones: 'Зон', captured: 'Захвачено', points: 'Очков',
        leaderboard: '🏆 ТУРНИРНАЯ ТАБЛИЦА',
        stats: '📊 Статистика', start: '🏃 СТАРТ', stop: '⏹ СТОП',
        free: '⬜ Свободна', vulnerable: '⚠️ Уязвима', protected: '🛡️ Защищена',
        other: '👤 Занята другим игроком', clickZone: 'Кликни на зону',
        noPlayers: 'Нет игроков', reset: 'Сбросить все зоны?',
        tooShort: '❌ Слишком короткий маршрут',
        speedError: '❌ Скорость не соответствует бегу!',
        needMorePoints: '❌ Нужно пробежать ≥ 80% периметра зоны!',
        notClosed: '❌ Маршрут не замкнут! Вернись в старт (< 50 м)',
        stolen: '✅ Зона отобрана!',
        capturedZone: '✅ Зона захвачена!',
        alreadyYours: '❌ Это твоя зона!',
        protectedZone: '🛡️ Зона защищена! Подожди 24 часа.',
        yourZone: 'Ты', otherPlayer: 'Другой игрок',
        perimeter: 'Периметр', sector: 'Сектор', owner: 'Владелец',
        noZones: 'Маршрут не захватил ни одной зоны'
      },
      en: {
        zones: 'Zones', captured: 'Captured', points: 'Points',
        leaderboard: '🏆 LEADERBOARD',
        stats: '📊 Statistics', start: '🏃 START', stop: '⏹ STOP',
        free: '⬜ Free', vulnerable: '⚠️ Vulnerable', protected: '🛡️ Protected',
        other: '👤 Occupied', clickZone: 'Click on zone',
        noPlayers: 'No players', reset: 'Reset all zones?',
        tooShort: '❌ Route too short',
        speedError: '❌ Speed does not match running!',
        needMorePoints: '❌ Need to run ≥ 80% of zone perimeter!',
        notClosed: '❌ Route not closed! Return to start (< 50 m)',
        stolen: '✅ Zone stolen!',
        capturedZone: '✅ Zone captured!',
        alreadyYours: '❌ This is your zone!',
        protectedZone: '🛡️ Zone is protected! Wait 24 hours.',
        yourZone: 'You', otherPlayer: 'Other player',
        perimeter: 'Perimeter', sector: 'Sector', owner: 'Owner',
        noZones: 'Route captured no zones'
      },
      vi: {
        zones: 'Khu vực', captured: 'Đã chiếm', points: 'Điểm',
        leaderboard: '🏆 BẢNG XẾP HẠNG',
        stats: '📊 Thống kê', start: '🏃 BẮT ĐẦU', stop: '⏹ DỪNG',
        free: '⬜ Trống', vulnerable: '⚠️ Dễ bị tấn công', protected: '🛡️ Được bảo vệ',
        other: '👤 Đã có chủ', clickZone: 'Nhấn vào khu vực',
        noPlayers: 'Không có người chơi', reset: 'Đặt lại tất cả khu vực?',
        tooShort: '❌ Đường chạy quá ngắn',
        speedError: '❌ Tốc độ không phù hợp với chạy bộ!',
        needMorePoints: '❌ Cần chạy ≥ 80% chu vi khu vực!',
        notClosed: '❌ Đường chạy chưa khép kín! Quay lại điểm xuất phát (< 50 m)',
        stolen: '✅ Đã chiếm khu vực!',
        capturedZone: '✅ Đã chiếm khu vực!',
        alreadyYours: '❌ Đây là khu vực của bạn!',
        protectedZone: '🛡️ Khu vực được bảo vệ! Đợi 24 giờ.',
        yourZone: 'Bạn', otherPlayer: 'Người chơi khác',
        perimeter: 'Chu vi', sector: 'Khu vực', owner: 'Chủ sở hữu',
        noZones: 'Đường chạy không chiếm được khu vực nào'
      }
    };

    let currentLang = 'ru';
    let currentPlayer = null;
    let playerId = null;
    let playerColor = '#e74c3c';

    function t(key) { return LANG[currentLang][key] || key; }

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn-small').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      updateAllTexts();
      drawZones();
      updateLeaderboard();
    }

    function updateAllTexts() {
      document.getElementById('statsTitle').textContent = t('stats');
      document.getElementById('lbTitle').textContent = t('leaderboard');
      if (!isRunning) {
        actionBtn.textContent = t('start');
      } else {
        actionBtn.textContent = t('stop');
      }
      updateUI();
    }

    document.getElementById('langRu').addEventListener('click', () => setLanguage('ru'));
    document.getElementById('langEn').addEventListener('click', () => setLanguage('en'));
    document.getElementById('langVi').addEventListener('click', () => setLanguage('vi'));

    // ============================================================
    // SUPABASE КЛИЕНТ
    // ============================================================
    const supabase = {
      url: SUPABASE_URL,
      key: SUPABASE_ANON_KEY,
      async query(endpoint, options = {}) {
        const res = await fetch(`${this.url}/rest/v1/${endpoint}`, {
          ...options,
          headers: {
            'apikey': this.key,
            'Authorization': `Bearer ${this.key}`,
            'Content-Type': 'application/json',
            ...(options.headers || {})
          }
        });
        return res.json();
      },
      async post(table, data) {
        return this.query(table, {
          method: 'POST',
          body: JSON.stringify(data),
          headers: { 'Prefer': 'return=representation' }
        });
      }
    };

    // ============================================================
    // УПРАВЛЕНИЕ ИГРОКОМ
    // ============================================================
    async function registerPlayer(username, color) {
      try {
        const result = await supabase.post('players', { username, color });
        if (result && result.length > 0) {
          return result[0];
        }
        return null;
      } catch (e) {
        console.error('Ошибка регистрации:', e);
        return null;
      }
    }

    async function getPlayerId(username) {
      try {
        const players = await supabase.query(`players?username=eq.${username}&select=id,color`);
        if (players && players.length > 0) {
          return players[0];
        }
        return null;
      } catch (e) {
        console.error('Ошибка поиска игрока:', e);
        return null;
      }
    }

    async function saveCapture(playerId, zoneId) {
      try {
        const result = await supabase.post('captures', {
          player_id: playerId,
          zone_id: zoneId,
          points: 1
        });
        return result;
      } catch (e) {
        console.error('Ошибка сохранения захвата:', e);
        return null;
      }
    }

    async function getCaptures() {
      try {
        const result = await supabase.query('captures?select=player_id,zone_id,points');
        return result || [];
      } catch (e) {
        console.error('Ошибка загрузки захватов:', e);
        return [];
      }
    }

    async function getPlayers() {
      try {
        const result = await supabase.query('players?select=id,username,color');
        return result || [];
      } catch (e) {
        console.error('Ошибка загрузки игроков:', e);
        return [];
      }
    }

    // ============================================================
    // ВЫБОР ЦВЕТА
    // ============================================================
    let selectedColor = '#e74c3c';

    document.querySelectorAll('.color-option').forEach(el => {
      el.addEventListener('click', function() {
        document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('selected'));
        this.classList.add('selected');
        selectedColor = this.dataset.color;
      });
    });

    // ============================================================
    // МОДАЛЬНОЕ ОКНО
    // ============================================================
    const modal = document.getElementById('nameModal');
    const usernameInput = document.getElementById('usernameInput');
    const saveBtn = document.getElementById('saveNameBtn');
    const nameError = document.getElementById('nameError');

    function showModal() {
      modal.style.display = 'flex';
      usernameInput.focus();
    }

    function hideModal() {
      modal.style.display = 'none';
    }

    saveBtn.addEventListener('click', async () => {
      const name = usernameInput.value.trim();
      if (name.length < 2) {
        nameError.style.display = 'block';
        return;
      }
      nameError.style.display = 'none';
      
      let player = await getPlayerId(name);
      if (!player) {
        const newPlayer = await registerPlayer(name, selectedColor);
        if (newPlayer) {
          player = newPlayer;
        }
      }
      
      if (player) {
        playerId = player.id;
        playerColor = player.color || selectedColor;
        currentPlayer = name;
        localStorage.setItem('playerName', name);
        localStorage.setItem('playerId', player.id);
        localStorage.setItem('playerColor', playerColor);
        document.getElementById('playerDisplay').textContent = `👤 ${name}`;
        hideModal();
        await loadGameData();
        drawZones();
        updateLeaderboard();
      } else {
        nameError.textContent = '⚠️ Ошибка регистрации. Попробуй ещё раз.';
        nameError.style.display = 'block';
      }
    });

    usernameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') saveBtn.click();
    });

    // ============================================================
    // ЗАГРУЗКА ДАННЫХ
    // ============================================================
    async function loadGameData() {
      try {
        const captures = await getCaptures();
        const players = await getPlayers();
        const playerMap = {};
        players.forEach(p => {
          playerMap[p.id] = { username: p.username, color: p.color };
        });
        captures.forEach(c => {
          const zone = zonesData.find(z => z.id === c.zone_id);
          if (zone) {
            zone.owner = c.player_id === playerId ? 'me' : c.player_id;
            zone.ownerColor = playerMap[c.player_id]?.color || '#e74c3c';
            zone.capturedAt = c.captured_at || Date.now();
          }
        });
        console.log('✅ Данные загружены:', captures.length, 'захватов');
      } catch (e) {
        console.warn('⚠️ Ошибка загрузки данных:', e);
      }
    }

    // ============================================================
    // КОНСТАНТЫ
    // ============================================================
    const PROTECTION_HOURS = 24;
    const STEAL_THRESHOLD = 0.8;
    const BUFFER = 20;
    const SPEED_MIN = 4;
    const SPEED_MAX = 25;
    const SEGMENT_SIZE = 10;

    // ============================================================
    // 22 ЗОНЫ

    // ============================================================
    // ТУРНИРНАЯ ТАБЛИЦА
    // ============================================================
    async function updateLeaderboard() {
      try {
        const players = await getPlayers();
        const captures = await getCaptures();
        
        const scoreMap = {};
        captures.forEach(c => {
          if (!scoreMap[c.player_id]) {
            scoreMap[c.player_id] = { points: 0, zones: 0 };
          }
          scoreMap[c.player_id].points += c.points || 1;
          scoreMap[c.player_id].zones += 1;
        });

        const playerMap = {};
        players.forEach(p => {
          playerMap[p.id] = { username: p.username, color: p.color || '#555' };
        });

        const sorted = Object.keys(scoreMap)
          .map(id => ({
            id,
            name: playerMap[id]?.username || 'Неизвестный',
            color: playerMap[id]?.color || '#555',
            points: scoreMap[id].points,
            zones: scoreMap[id].zones
          }))
          .sort((a, b) => b.points - a.points || b.zones - a.zones);

        if (sorted.length === 0) {
          lbContent.innerHTML = `<div class="empty">${t('noPlayers')}</div>`;
          return;
        }

        let html = '';
        sorted.forEach((p, i) => {
          const pos = i + 1;
          let posClass = 'lb-pos';
          if (pos === 1) posClass += ' top1';
          else if (pos === 2) posClass += ' top2';
          else if (pos === 3) posClass += ' top3';
          const isMe = p.id === playerId;
          html += `
            <div class="lb-item ${isMe ? 'me' : ''}">
              <span>
                <span class="${posClass}">#${pos}</span>
                <span class="color-dot" style="background:${p.color}"></span>
                <span class="name">${p.name}</span>
              </span>
              <span class="score">${p.points}⭐ (${p.zones}з)</span>
            </div>
          `;
        });
        lbContent.innerHTML = html;
      } catch (e) {
        console.warn('Ошибка обновления таблицы:', e);
        lbContent.innerHTML = `<div class="empty">⚠️ Ошибка загрузки</div>`;
      }
    }

    // ============================================================
    // РИСОВАНИЕ ЗОН (исправлено — цвет игрока)
    // ============================================================
    function drawZones() {
      zoneLayers.forEach(l => map.removeLayer(l));
      labelLayers.forEach(l => map.removeLayer(l));
      zoneLayers = [];
      labelLayers = [];

      zonesData.forEach((zone) => {
        const isMine = zone.owner === 'me';
        const isCaptured = !!zone.capturedAt;
        const protected_ = isProtected(zone);
        const perimeter = calcPerimeter(zone.coords);
        const points = getPoints(zone);
        const isHighlighted = highlightedZone === zone.id;
        
        let color;
        if (!isCaptured) {
          color = 'rgba(100,100,100,0.3)';
        } else if (isMine) {
          color = playerColor || '#2ecc71';
        } else {
          color = zone.ownerColor || '#e74c3c';
        }

        let fillColor, fillOpacity, weight, labelClass, dashArray;

        if (!isCaptured) {
          fillColor = 'rgba(100,100,100,0.05)';
          fillOpacity = 0.05;
          weight = isHighlighted ? 5 : 2;
          labelClass = 'free';
          dashArray = '5, 5';
        } else if (isMine) {
          if (protected_) {
            fillColor = isHighlighted ? color + '88' : color + '44';
            fillOpacity = isHighlighted ? 0.5 : 0.25;
            weight = isHighlighted ? 6 : 4;
            labelClass = 'captured';
            dashArray = null;
          } else {
            fillColor = isHighlighted ? '#f1c40f88' : '#f1c40f44';
            fillOpacity = isHighlighted ? 0.5 : 0.25;
            weight = isHighlighted ? 6 : 4;
            labelClass = 'vulnerable';
            dashArray = null;
          }
        } else {
          fillColor = isHighlighted ? color + '66' : color + '33';
          fillOpacity = isHighlighted ? 0.4 : 0.2;
          weight = isHighlighted ? 5 : 3;
          labelClass = 'other';
          dashArray = null;
        }

        const polygon = L.polygon(zone.coords, {
          color: color,
          weight: weight,
          opacity: isHighlighted ? 1 : 0.9,
          fillColor: fillColor,
          fillOpacity: fillOpacity,
          interactive: true,
          smoothFactor: 1,
          dashArray: dashArray,
          className: isHighlighted ? 'highlighted-zone' : ''
        });

        let statusText = '';
        if (!isCaptured) {
          statusText = t('free');
        } else if (isMine && protected_) {
          statusText = t('protected');
        } else if (isMine && !protected_) {
          statusText = t('vulnerable');
        } else {
          statusText = t('other');
        }

        polygon.bindPopup(`
          <b>🏛️ ${t('zones')} ${zone.id}</b><br>
          ${zone.name}<br>
          📍 ${t('sector')}: ${zone.sector}<br>
          📏 ${t('perimeter')}: ${perimeter} м<br>
          ${isCaptured ? `👤 ${t('owner')}: ${isMine ? t('yourZone') : t('otherPlayer')}` : t('free')}<br>
          ${isCaptured ? `🛡️ ${statusText}` : ''}<br>
          ${isCaptured && isMine ? `⭐ ${t('points')}: ${points}` : ''}
          ${!isCaptured ? '🏃 Нажми СТАРТ, чтобы захватить!' : ''}
        `);

        polygon.on('click', () => {
          if (highlightedZone === zone.id) {
            highlightedZone = null;
          } else {
            highlightedZone = zone.id;
          }
          drawZones();
          let statusText = '';
          if (!isCaptured) {
            statusText = t('free');
          } else if (isMine && protected_) {
            statusText = t('protected');
          } else if (isMine && !protected_) {
            statusText = t('vulnerable');
          } else {
            statusText = t('other');
          }
          statsContent.innerHTML = `
            <div class="stat-item">🏛️ ${t('zones')} ${zone.id}</div>
            <div class="stat-item">📍 ${zone.name}</div>
            <div class="stat-item">📐 ${t('sector')}: ${zone.sector}</div>
            <div class="stat-item">📏 ${t('perimeter')}: ${perimeter} м</div>
            <div class="stat-item" style="border-bottom:none;color:${isCaptured ? (isMine ? (protected_ ? '#2ecc71' : '#f1c40f') : '#e74c3c') : '#888'};">
              ${statusText}
            </div>
            ${isCaptured && isMine ? `<div class="stat-item" style="border-bottom:none;color:#f1c40f;">⭐ ${t('points')}: ${points}</div>` : ''}
          `;
        });

        polygon.addTo(map);
        zoneLayers.push(polygon);

        const center = zone.coords.reduce(
          (acc, p) => [acc[0] + p[0] / zone.coords.length, acc[1] + p[1] / zone.coords.length],
          [0, 0]
        );

        let labelHtml = zone.id;
        if (isCaptured && isMine && protected_) {
          labelHtml += ' 🔒';
        } else if (isCaptured && isMine && !protected_) {
          labelHtml += ' ⚠️';
        } else if (isCaptured && !isMine) {
          labelHtml += ' 🔴';
        }

        const label = L.marker(center, {
          icon: L.divIcon({
            className: `zone-label ${labelClass}`,
            html: labelHtml,
            iconSize: [50, 34],
            iconAnchor: [25, 17]
          }),
          interactive: false
        });
        label.addTo(map);
        labelLayers.push(label);
      });

      updateUI();
      updateLeaderboard();
    }

    // ============================================================
    // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================
    function calcPerimeter(coords) {
      if (coords.length < 2) return 0;
      let total = 0;
      for (let i = 0; i < coords.length - 1; i++) {
        total += map.distance(coords[i], coords[i + 1]);
      }
      total += map.distance(coords[coords.length - 1], coords[0]);
      return Math.round(total);
    }

    function getDaysSince(timestamp) {
      const now = Date.now();
      const diff = now - timestamp;
      return diff / (1000 * 60 * 60 * 24);
    }

    function getHoursSince(timestamp) {
      const now = Date.now();
      const diff = now - timestamp;
      return diff / (1000 * 60 * 60);
    }

    function isProtected(zone) {
      if (!zone.capturedAt) return false;
      return getHoursSince(zone.capturedAt) < PROTECTION_HOURS;
    }

    function getPoints(zone) {
      if (!zone.capturedAt) return 0;
      const days = Math.floor(getDaysSince(zone.capturedAt));
      return days * 1;
    }

    // ============================================================
    // ПРОВЕРКА СКОРОСТИ
    // ============================================================
    function checkSpeed(points) {
      if (points.length < 5) return false;
      const speeds = [];
      for (let i = 0; i < points.length - SEGMENT_SIZE; i += SEGMENT_SIZE) {
        const segment = points.slice(i, i + SEGMENT_SIZE);
        if (segment.length < 2) continue;
        let dist = 0;
        for (let j = 1; j < segment.length; j++) {
          dist += map.distance(segment[j-1], segment[j]);
        }
        const hours = (segment.length - 1) * 2 / 3600;
        if (hours === 0) continue;
        const speed = dist / 1000 / hours;
        if (speed > 2 && speed < 30) {
          speeds.push(speed);
        }
      }
      if (speeds.length === 0) return false;
      speeds.sort((a, b) => a - b);
      const median = speeds[Math.floor(speeds.length / 2)];
      return median >= SPEED_MIN && median <= SPEED_MAX;
    }

    // ============================================================
    // ПРОВЕРКА ОТБОРА
    // ============================================================
    function checkSteal(zone, points) {
      if (zone.owner === 'me') return false;
      if (!zone.capturedAt) return false;
      if (isProtected(zone)) return false;
      if (points.length < 5) return false;
      if (!checkSpeed(points)) {
        alert(t('speedError'));
        return false;
      }
      const perimeter = calcPerimeter(zone.coords);
      if (perimeter === 0) return false;
      let covered = 0;
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        let minDist = Infinity;
        for (let j = 0; j < zone.coords.length; j++) {
          const d = map.distance(p, zone.coords[j]);
          if (d < minDist) minDist = d;
        }
        if (minDist < BUFFER) {
          covered++;
        }
      }
      const coverage = covered / points.length;
      return coverage >= STEAL_THRESHOLD;
    }

    // ============================================================
    // ЗАХВАТ ЗОНЫ (исправлено — сохраняем цвет)
    // ============================================================
    async function captureZone(zoneId) {
      const zone = zonesData.find(z => z.id === zoneId);
      if (!zone) return;

      if (zone.capturedAt) {
        if (zone.owner === 'me') {
          alert(t('alreadyYours'));
          return;
        }
        if (isProtected(zone)) {
          alert(t('protectedZone'));
          return;
        }
        if (route.length < 5) {
          alert(t('tooShort'));
          return;
        }
        if (!checkSteal(zone, route)) {
          alert(t('needMorePoints'));
          return;
        }
        alert(t('stolen'));
      } else {
        alert(t('capturedZone'));
      }

      zone.capturedAt = Date.now();
      zone.owner = 'me';
      zone.ownerColor = playerColor;
      capturedZones.add(zone.id);

      if (playerId) {
        await saveCapture(playerId, zoneId);
        await updateLeaderboard();
      }

      saveState();
      highlightedZone = zone.id;
      drawZones();
      updateUI();
    }

    // ============================================================
    // СОХРАНЕНИЕ
    // ============================================================
    function saveState() {
      try {
        const state = zonesData.map(z => ({
          id: z.id,
          capturedAt: z.capturedAt || null,
          owner: z.owner || null,
          ownerColor: z.ownerColor || null
        }));
        localStorage.setItem('runningGameState', JSON.stringify(state));
      } catch (e) {}
    }

    function loadState() {
      try {
        const saved = localStorage.getItem('runningGameState');
        if (saved) {
          const parsed = JSON.parse(saved);
          zonesData.forEach(z => {
            const found = parsed.find(p => p.id === z.id);
            if (found) {
              z.capturedAt = found.capturedAt;
              z.owner = found.owner || null;
              z.ownerColor = found.ownerColor || null;
            }
          });
        }
      } catch (e) {}
    }

    // ============================================================
    // UI
    // ============================================================
    function updateUI() {
      const total = zonesData.length;
      const captured = zonesData.filter(z => z.owner === 'me').length;
      const totalPoints = zonesData
        .filter(z => z.owner === 'me')
        .reduce((sum, z) => sum + getPoints(z), 0);

      zoneCountSpan.textContent = `🏛️ ${t('zones')}: ${captured}/${total}`;
      capturedCountSpan.textContent = `✅ ${t('captured')}: ${captured}`;
      totalPointsSpan.textContent = `⭐ ${t('points')}: ${totalPoints}`;
    }

    // ============================================================
    // БЕГ
    // ============================================================
    function startRun() {
      route = [];
      isRunning = true;
      actionBtn.textContent = t('stop');
      actionBtn.className = 'stop-btn';
      if (polyline) { map.removeLayer(polyline); polyline = null; }

      navigator.geolocation.getCurrentPosition(
        pos => {
          route.push([pos.coords.latitude, pos.coords.longitude]);
          updateUI();
        },
        () => {},
        { enableHighAccuracy: true }
      );

      watchId = navigator.geolocation.watchPosition(
        pos => {
          const p = [pos.coords.latitude, pos.coords.longitude];
          route.push(p);
          if (polyline) map.removeLayer(polyline);
          polyline = L.polyline(route, { color: '#e74c3c', weight: 4, opacity: 0.9 }).addTo(map);
          map.setView(p, 15);
          updateUI();
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 2000 }
      );
    }

    function stopRun() {
      if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      isRunning = false;
      actionBtn.textContent = t('start');
      actionBtn.className = '';

      if (route.length < 5) {
        alert(t('tooShort'));
        return;
      }

      const first = route[0];
      const last = route[route.length - 1];
      if (map.distance(first, last) < 50) {
        let captured = false;
        for (const zone of zonesData) {
          if (zone.owner === 'me') continue;
          const center = zone.coords.reduce(
            (acc, p) => [acc[0] + p[0] / zone.coords.length, acc[1] + p[1] / zone.coords.length],
            [0, 0]
          );
          if (pointInPolygon(center, route)) {
            captureZone(zone.id);
            captured = true;
            break;
          }
        }
        if (!captured) {
          alert(t('noZones'));
        }
      } else {
        alert(t('notClosed'));
      }
      updateUI();
    }

    function pointInPolygon(point, polygon) {
      let inside = false;
      const x = point[1], y = point[0];
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const xi = polygon[i][1], yi = polygon[i][0];
        const xj = polygon[j][1], yj = polygon[j][0];
        const intersect = ((yi > y) !== (yj > y)) &&
          (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function resetGame() {
      if (isRunning) {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        isRunning = false;
        actionBtn.textContent = t('start');
        actionBtn.className = '';
      }
      if (confirm(t('reset'))) {
        zonesData.forEach(z => {
          z.capturedAt = null;
          z.owner = null;
          z.ownerColor = null;
        });
        capturedZones.clear();
        route = [];
        highlightedZone = null;
        if (polyline) { map.removeLayer(polyline); polyline = null; }
        saveState();
        drawZones();
        updateUI();
        statsContent.innerHTML = `⬜ ${t('clickZone')}`;
      }
    }

    // ============================================================
    // КНОПКИ
    // ============================================================
    actionBtn.addEventListener('click', () => isRunning ? stopRun() : startRun());
    resetBtn.addEventListener('click', resetGame);
    leaderboardToggle.addEventListener('click', () => {
      leaderboardVisible = !leaderboardVisible;
      leaderboardEl.style.display = leaderboardVisible ? 'block' : 'none';
    });

    // ============================================================
    // ГЕОЛОКАЦИЯ
    // ============================================================
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          map.setView([pos.coords.latitude, pos.coords.longitude], 13);
          L.marker([pos.coords.latitude, pos.coords.longitude])
            .addTo(map)
            .bindPopup('📍 Вы здесь');
        },
        () => {},
        { enableHighAccuracy: true }
      );
    }

    // ============================================================
    // ЗАПУСК
    // ============================================================
    loadState();
    drawZones();
    updateAllTexts();

    const savedPlayer = localStorage.getItem('playerName');
    const savedColor = localStorage.getItem('playerColor');
    if (savedPlayer) {
      currentPlayer = savedPlayer;
      if (savedColor) playerColor = savedColor;
      document.getElementById('playerDisplay').textContent = `👤 ${savedPlayer}`;
      getPlayerId(savedPlayer).then(player => {
        if (player) {
          playerId = player.id;
          if (player.color) {
            playerColor = player.color;
            localStorage.setItem('playerColor', playerColor);
          }
          loadGameData().then(() => {
            drawZones();
            updateLeaderboard();
          });
        }
      });
    } else {
      showModal();
    }

    console.log('🏃 Игра с выбором цвета запущена!');
  </script>
</body>
</html>
