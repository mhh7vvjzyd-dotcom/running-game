<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🏃 Захват города</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, Arial, sans-serif; background: #000; }
    #map { height: 100vh; width: 100vw; }
    
    .info-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-around;
      z-index: 1000;
      font-size: 14px;
      backdrop-filter: blur(10px);
    }
    
    .controls {
      position: fixed;
      bottom: 50px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 1000;
    }
    
    button {
      padding: 18px 50px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      color: white;
      background: linear-gradient(135deg, #4CAF50, #45a049);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: 0.3s;
      min-width: 200px;
    }
    
    button:active { transform: scale(0.95); }
    .stop-btn { background: linear-gradient(135deg, #f44336, #d32f2f); }
    
    .territories {
      position: fixed;
      bottom: 130px;
      right: 16px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 12px;
      max-width: 180px;
      z-index: 1000;
      backdrop-filter: blur(10px);
      max-height: 200px;
      overflow-y: auto;
    }
    .territories h4 { margin-bottom: 6px; border-bottom: 1px solid #555; padding-bottom: 4px; }
    .territory-item { padding: 4px 0; border-bottom: 1px solid #333; font-size: 11px; }
  </style>
</head>
<body>

  <div id="map"></div>
  
  <div class="info-panel" id="infoPanel">
    <span id="pointsCount">📍 0 точек</span>
    <span id="distanceDisplay">📏 0 м</span>
    <span id="loopStatus">🔓 Не замкнуто</span>
  </div>

  <div class="controls">
    <button id="actionBtn">🏃 СТАРТ</button>
  </div>

  <div class="territories" id="territoriesList">
    <h4>🏅 Мои территории</h4>
    <div id="territoriesContent">Пока пусто</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ===== СОСТОЯНИЕ =====
    let map, watchId = null;
    let isRunning = false;
    let route = [];
    let territories = [];
    let startPoint = null;
    let polyline = null;
    let startMarker = null;

    // DOM элементы
    const pointsSpan = document.getElementById('pointsCount');
    const distanceSpan = document.getElementById('distanceDisplay');
    const loopSpan = document.getElementById('loopStatus');
    const actionBtn = document.getElementById('actionBtn');
    const territoriesContent = document.getElementById('territoriesContent');

    // ===== ИНИЦИАЛИЗАЦИЯ КАРТЫ =====
    map = L.map('map', {
      center: [55.7558, 37.6173],
      zoom: 14,
      zoomControl: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // ===== ГЕОЛОКАЦИЯ =====
    function updateLocation() {
      if (!navigator.geolocation) {
        alert('Ваш браузер не поддерживает геолокацию');
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          const { latitude, longitude } = pos.coords;
          map.setView([latitude, longitude], 17);
          L.marker([latitude, longitude]).addTo(map).bindPopup('Вы здесь');
        },
        err => alert('Ошибка GPS: ' + err.message),
        { enableHighAccuracy: true }
      );
    }
    updateLocation();

    // ===== РАСЧЁТ РАССТОЯНИЯ =====
    function calcDistance(points) {
      if (points.length < 2) return 0;
      let total = 0;
      for (let i = 1; i < points.length; i++) {
        total += map.distance(points[i-1], points[i]);
      }
      return total;
    }

    // ===== ПРОВЕРКА ПЕТЛИ =====
    function isLoopClosed(points) {
      if (points.length < 5) return false;
      const first = points[0];
      const last = points[points.length - 1];
      return map.distance(first, last) < 50;
    }

    // ===== ОБНОВЛЕНИЕ ИНФОРМАЦИИ =====
    function updateUI() {
      pointsSpan.textContent = '📍 ' + route.length + ' точек';
      distanceSpan.textContent = '📏 ' + Math.round(calcDistance(route)) + ' м';
      
      if (isLoopClosed(route) && route.length > 0) {
        loopSpan.textContent = '🔒 ПЕТЛЯ!';
        loopSpan.style.color = '#4CAF50';
      } else {
        loopSpan.textContent = '🔓 Не замкнуто';
        loopSpan.style.color = '#ff6b6b';
      }
    }

    // ===== ОБНОВЛЕНИЕ СПИСКА ТЕРРИТОРИЙ =====
    function updateTerritories() {
      if (territories.length === 0) {
        territoriesContent.textContent = 'Пока пусто';
        return;
      }
      let html = '';
      territories.slice().reverse().slice(0, 5).forEach((t, i) => {
        html += `<div class="territory-item">#${i+1} — ${Math.round(t.area)} м²</div>`;
      });
      territoriesContent.innerHTML = html;
    }

    // ===== СТАРТ =====
    function startRun() {
      if (!navigator.geolocation) return;
      
      route = [];
      isRunning = true;
      actionBtn.textContent = '⏹ СТОП';
      actionBtn.className = 'stop-btn';

      // Удаляем старую линию и маркер
      if (polyline) { map.removeLayer(polyline); polyline = null; }
      if (startMarker) { map.removeLayer(startMarker); startMarker = null; }

      // Получаем стартовую точку
      navigator.geolocation.getCurrentPosition(
        pos => {
          const p = [pos.coords.latitude, pos.coords.longitude];
          startPoint = p;
          route.push(p);
          startMarker = L.marker(p).addTo(map).bindPopup('🏁 Старт');
          updateUI();
        },
        err => alert('Ошибка GPS: ' + err.message),
        { enableHighAccuracy: true }
      );

      // Начинаем следить за перемещениями
      watchId = navigator.geolocation.watchPosition(
        pos => {
          const p = [pos.coords.latitude, pos.coords.longitude];
          route.push(p);
          
          // Обновляем линию
          if (polyline) map.removeLayer(polyline);
          polyline = L.polyline(route, { color: '#FF4444', weight: 4 }).addTo(map);
          
          // Центрируем карту
          map.setView(p, 17);
          updateUI();
        },
        err => alert('Ошибка GPS: ' + err.message),
        { enableHighAccuracy: true, maximumAge: 2000, timeout: 5000 }
      );
    }

    // ===== СТОП =====
    function stopRun() {
      if (watchId) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      isRunning = false;
      actionBtn.textContent = '🏃 СТАРТ';
      actionBtn.className = '';

      if (route.length < 5) {
        alert('❌ Слишком короткий маршрут');
        return;
      }

      if (isLoopClosed(route)) {
        // Рассчитываем площадь
        try {
          const polygon = L.polygon(route);
          const area = polygon.getArea();
          territories.push({ id: Date.now(), area: area, points: route });
          alert('🏆 Территория захвачена!\nПлощадь: ' + Math.round(area) + ' м²');
          updateTerritories();
          
          // Рисуем захваченную территорию
          L.polygon(route, {
            color: '#4CAF50',
            weight: 3,
            fillColor: '#4CAF50',
            fillOpacity: 0.3
          }).addTo(map);
        } catch(e) {
          alert('Ошибка: ' + e.message);
        }
      } else {
        alert('❌ Маршрут не замкнут!\nВернись в точку старта (< 50 м)');
      }
      
      updateUI();
    }

    // ===== КНОПКА =====
    actionBtn.addEventListener('click', () => {
      if (!isRunning) {
        startRun();
      } else {
        stopRun();
      }
    });

    // ===== ПРИ ЗАГРУЗКЕ =====
    updateUI();
    updateTerritories();
  </script>
</body>
</html>
