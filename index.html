<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🏃 Карта Нячанга — Зона</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, Arial, sans-serif; background: #0f0f1a; }
    #map { height: 100vh; width: 100vw; }
    
    .info-panel {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 10px 16px;
      border-radius: 14px;
      display: flex;
      justify-content: space-around;
      z-index: 1000;
      font-size: 13px;
      backdrop-filter: blur(12px);
      flex-wrap: wrap;
      gap: 8px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .badge-green { background: #2ecc71; border-radius: 20px; padding: 2px 12px; font-weight: bold; }
    
    .controls {
      position: fixed;
      bottom: 40px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 1000;
    }
    
    button {
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      color: white;
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      box-shadow: 0 4px 20px rgba(46,204,113,0.3);
      cursor: pointer;
      transition: 0.3s;
      min-width: 140px;
    }
    button:active { transform: scale(0.95); }
    .reset-btn {
      background: linear-gradient(135deg, #555, #333);
      min-width: 56px;
      padding: 16px 18px;
    }
    
    .stats {
      position: fixed;
      bottom: 120px;
      right: 16px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 12px;
      z-index: 1000;
      backdrop-filter: blur(10px);
      max-width: 170px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .stats h4 { margin-bottom: 6px; border-bottom: 1px solid #444; padding-bottom: 4px; }
    .stat-item { padding: 3px 0; border-bottom: 1px solid #2a2a2a; font-size: 11px; }

    .zone-label {
      background: rgba(0,0,0,0.8);
      color: white;
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid rgba(255,255,255,0.3);
      text-align: center;
      pointer-events: none;
      font-family: monospace;
      text-shadow: 0 0 12px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="info-panel" id="infoPanel">
    <span id="zoneStatus">🏛️ Зона 01</span>
    <span id="capturedStatus" class="badge-green">⬜ Свободна</span>
  </div>

  <div class="stats" id="statsPanel">
    <h4>📊 Зона</h4>
    <div id="statsContent">Информация</div>
  </div>

  <div class="controls">
    <button class="reset-btn" id="resetBtn">🗑️</button>
    <button id="actionBtn">🏃 СТАРТ</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ============================================================
    // ЗОНА ПО ТВОИМ КООРДИНАТАМ
    // ============================================================
    const zone = {
      id: '01',
      name: 'Vĩnh Hải',
      sector: 'Центр',
      coords: [
        [12.2959054, 109.2216405],
        [12.2951267, 109.2177517],
        [12.2923235, 109.2125609],
        [12.2921000, 109.2110000],
        [12.2924772, 109.2094382],
        [12.2941344, 109.2126608],
        [12.2956220, 109.2136707],
        [12.2972075, 109.2161775],
        [12.2974191, 109.2184759]
      ]
    };

    // ============================================================
    // КАРТА
    // ============================================================
    const map = L.map('map', {
      center: [12.295, 109.216],
      zoom: 15,
      zoomControl: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // ============================================================
    // СОСТОЯНИЕ
    // ============================================================
    let isCaptured = false;

    const zoneStatus = document.getElementById('zoneStatus');
    const capturedStatus = document.getElementById('capturedStatus');
    const statsContent = document.getElementById('statsContent');
    const actionBtn = document.getElementById('actionBtn');
    const resetBtn = document.getElementById('resetBtn');

    // ============================================================
    // РИСУЕМ ЗОНУ
    // ============================================================
    function drawZone() {
      // Полигон
      const polygon = L.polygon(zone.coords, {
        color: isCaptured ? '#2ecc71' : '#3498db',
        weight: 3,
        opacity: 0.9,
        fillColor: isCaptured ? '#2ecc71' : '#3498db',
        fillOpacity: isCaptured ? 0.4 : 0.15,
        interactive: true
      }).addTo(map);

      polygon.bindPopup(`
        <b>🏛️ Зона ${zone.id}</b><br>
        ${zone.name}<br>
        📍 ${zone.sector}<br>
        ${isCaptured ? '✅ Захвачена' : '⬜ Свободна'}
      `);

      // Метка с номером
      const center = zone.coords.reduce(
        (acc, p) => [acc[0] + p[0] / zone.coords.length, acc[1] + p[1] / zone.coords.length],
        [0, 0]
      );

      const label = L.marker(center, {
        icon: L.divIcon({
          className: 'zone-label',
          html: zone.id,
          iconSize: [40, 30],
          iconAnchor: [20, 15]
        }),
        interactive: false
      }).addTo(map);

      // Маркеры точек
      zone.coords.forEach((p, i) => {
        L.marker(p, {
          icon: L.divIcon({
            className: 'point-label',
            html: `<div style="
              background: rgba(0,0,0,0.7);
              color: white;
              border-radius: 50%;
              width: 22px;
              height: 22px;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 10px;
              font-weight: bold;
              border: 2px solid #f1c40f;
            ">${i + 1}</div>`,
            iconSize: [22, 22],
            iconAnchor: [11, 11]
          }),
          interactive: false
        }).addTo(map);
      });

      updateUI();
    }

    // ============================================================
    // ОБНОВЛЕНИЕ UI
    // ============================================================
    function updateUI() {
      zoneStatus.textContent = `🏛️ Зона ${zone.id} — ${zone.name}`;
      capturedStatus.textContent = isCaptured ? '✅ Захвачена' : '⬜ Свободна';
      capturedStatus.className = isCaptured ? 'badge-green' : '';

      statsContent.innerHTML = `
        <div class="stat-item">📍 Район: ${zone.name}</div>
        <div class="stat-item">📐 Сектор: ${zone.sector}</div>
        <div class="stat-item" style="border-bottom:none;color:${isCaptured ? '#2ecc71' : '#f39c12'};">
          ${isCaptured ? '✅ Захвачена' : '⬜ Свободна'}
        </div>
      `;
    }

    // ============================================================
    // КНОПКИ
    // ============================================================
    actionBtn.addEventListener('click', () => {
      isCaptured = !isCaptured;
      // Очищаем карту и перерисовываем
      map.eachLayer(layer => {
        if (layer instanceof L.Polygon || layer instanceof L.Marker) {
          map.removeLayer(layer);
        }
      });
      drawZone();
    });

    resetBtn.addEventListener('click', () => {
      isCaptured = false;
      map.eachLayer(layer => {
        if (layer instanceof L.Polygon || layer instanceof L.Marker) {
          map.removeLayer(layer);
        }
      });
      drawZone();
    });

    // ============================================================
    // ГЕОЛОКАЦИЯ
    // ============================================================
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          map.setView([pos.coords.latitude, pos.coords.longitude], 15);
          L.marker([pos.coords.latitude, pos.coords.longitude])
            .addTo(map)
            .bindPopup('📍 Вы здесь');
        },
        () => {},
        { enableHighAccuracy: true }
      );
    }

    // ============================================================
    // ЗАПУСК
    // ============================================================
    drawZone();
    console.log('🏃 Зона по твоим координатам');
  </script>
</body>
</html>
