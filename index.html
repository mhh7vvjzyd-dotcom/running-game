<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🏃 Нячанг — Карта зон</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, Arial, sans-serif; background: #0f0f1a; }
    #map { height: 100vh; width: 100vw; }
    
    .info-panel {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 10px 16px;
      border-radius: 14px;
      display: flex;
      justify-content: space-around;
      z-index: 1000;
      font-size: 13px;
      backdrop-filter: blur(12px);
      flex-wrap: wrap;
      gap: 8px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    
    .controls {
      position: fixed;
      bottom: 40px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 1000;
    }
    
    button {
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      color: white;
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      box-shadow: 0 4px 20px rgba(46,204,113,0.3);
      cursor: pointer;
      transition: 0.3s;
      min-width: 140px;
    }
    button:active { transform: scale(0.95); }
    .reset-btn {
      background: linear-gradient(135deg, #555, #333);
      min-width: 56px;
      padding: 16px 18px;
    }
    
    .stats {
      position: fixed;
      bottom: 120px;
      right: 16px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 12px;
      z-index: 1000;
      backdrop-filter: blur(10px);
      max-width: 170px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .stats h4 { margin-bottom: 6px; border-bottom: 1px solid #444; padding-bottom: 4px; }
    .stat-item { padding: 3px 0; border-bottom: 1px solid #2a2a2a; font-size: 11px; }

    .zone-label {
      background: rgba(0,0,0,0.8);
      color: white;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: bold;
      border: 2px solid rgba(255,255,255,0.3);
      text-align: center;
      pointer-events: none;
      font-family: monospace;
      text-shadow: 0 0 10px rgba(0,0,0,0.9);
    }
    .zone-label.captured {
      background: rgba(46,204,113,0.9);
      border-color: #2ecc71;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="info-panel" id="infoPanel">
    <span id="zoneCount">🏛️ Зон: 0/27</span>
    <span id="capturedCount">✅ Захвачено: 0</span>
  </div>

  <div class="stats" id="statsPanel">
    <h4>📊 Статистика</h4>
    <div id="statsContent">Загрузка...</div>
  </div>

  <div class="controls">
    <button class="reset-btn" id="resetBtn">🗑️</button>
    <button id="actionBtn">🏃 СТАРТ</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ============================================================
    // 27 ЗОН НЯЧАНГА (РЕАЛЬНЫЕ РАЙОНЫ)
    // Север → Центр → Юг → Запад → Восток
    // ============================================================
    const allZones = [
      // ===== СЕВЕР (зоны 01–07) =====
      { id: '01', name: 'Vĩnh Hòa', lat: 12.335, lng: 109.202, size: 0.022, sector: 'Север' },
      { id: '02', name: 'Vĩnh Hải', lat: 12.318, lng: 109.208, size: 0.020, sector: 'Север' },
      { id: '03', name: 'Vĩnh Phước', lat: 12.300, lng: 109.215, size: 0.021, sector: 'Север' },
      { id: '04', name: 'Vĩnh Thọ', lat: 12.282, lng: 109.212, size: 0.019, sector: 'Север' },
      { id: '05', name: 'Xương Huân', lat: 12.265, lng: 109.208, size: 0.020, sector: 'Север' },
      { id: '06', name: 'Vạn Thắng', lat: 12.250, lng: 109.215, size: 0.019, sector: 'Север' },
      { id: '07', name: 'Vạn Thạnh', lat: 12.238, lng: 109.212, size: 0.018, sector: 'Север' },

      // ===== ЦЕНТР (зоны 08–14) =====
      { id: '08', name: 'Phương Sài', lat: 12.225, lng: 109.208, size: 0.019, sector: 'Центр' },
      { id: '09', name: 'Phương Sơn', lat: 12.212, lng: 109.215, size: 0.018, sector: 'Центр' },
      { id: '10', name: 'Lộc Thọ', lat: 12.198, lng: 109.212, size: 0.019, sector: 'Центр' },
      { id: '11', name: 'Phước Hải', lat: 12.185, lng: 109.218, size: 0.018, sector: 'Центр' },
      { id: '12', name: 'Vĩnh Nguyên', lat: 12.172, lng: 109.215, size: 0.019, sector: 'Центр' },
      { id: '13', name: 'Vĩnh Trường', lat: 12.158, lng: 109.220, size: 0.018, sector: 'Центр' },
      { id: '14', name: 'Phước Long', lat: 12.145, lng: 109.215, size: 0.019, sector: 'Центр' },

      // ===== ЮГ (зоны 15–20) =====
      { id: '15', name: 'Vĩnh Lương', lat: 12.130, lng: 109.212, size: 0.020, sector: 'Юг' },
      { id: '16', name: 'Vĩnh Phương', lat: 12.118, lng: 109.218, size: 0.019, sector: 'Юг' },
      { id: '17', name: 'Vĩnh Thạnh', lat: 12.105, lng: 109.215, size: 0.020, sector: 'Юг' },
      { id: '18', name: 'Vĩnh Thái', lat: 12.092, lng: 109.220, size: 0.019, sector: 'Юг' },
      { id: '19', name: 'Vĩnh Hiệp', lat: 12.080, lng: 109.215, size: 0.020, sector: 'Юг' },
      { id: '20', name: 'Vĩnh Ngọc', lat: 12.068, lng: 109.218, size: 0.019, sector: 'Юг' },

      // ===== ЗАПАД (зоны 21–24) =====
      { id: '21', name: 'Phước Đồng', lat: 12.128, lng: 109.178, size: 0.025, sector: 'Запад' },
      { id: '22', name: 'Phước Tân', lat: 12.112, lng: 109.182, size: 0.024, sector: 'Запад' },
      { id: '23', name: 'Vạn Hương', lat: 12.098, lng: 109.178, size: 0.025, sector: 'Запад' },
      { id: '24', name: 'Vạn Phú', lat: 12.082, lng: 109.182, size: 0.024, sector: 'Запад' },

      // ===== ВОСТОК (зоны 25–27) =====
      { id: '25', name: 'Vĩnh Tân', lat: 12.138, lng: 109.235, size: 0.016, sector: 'Восток' },
      { id: '26', name: 'Phước Trung', lat: 12.122, lng: 109.238, size: 0.015, sector: 'Восток' },
      { id: '27', name: 'Vĩnh Hội', lat: 12.108, lng: 109.235, size: 0.016, sector: 'Восток' }
    ];

    // ============================================================
    // КАРТА
    // ============================================================
    const map = L.map('map', {
      center: [12.200, 109.210],
      zoom: 12,
      zoomControl: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // ============================================================
    // СОСТОЯНИЕ
    // ============================================================
    let capturedZones = new Set();
    let zoneLayers = [];
    let labelLayers = [];

    const zoneCountSpan = document.getElementById('zoneCount');
    const capturedCountSpan = document.getElementById('capturedCount');
    const statsContent = document.getElementById('statsContent');
    const actionBtn = document.getElementById('actionBtn');
    const resetBtn = document.getElementById('resetBtn');

    // ============================================================
    // ЦВЕТА ДЛЯ ЗОН
    // ============================================================
    const colors = [
      '#3498db', '#2ecc71', '#e74c3c', '#f39c12', '#9b59b6',
      '#1abc9c', '#e67e22', '#2c3e50', '#16a085', '#c0392b',
      '#8e44ad', '#2980b9', '#d35400', '#27ae60', '#7f8c8d',
      '#2ecc71', '#e74c3c', '#f1c40f', '#3498db', '#e67e22',
      '#9b59b6', '#1abc9c', '#2c3e50', '#16a085', '#c0392b',
      '#8e44ad', '#2980b9'
    ];

    // ============================================================
    // РИСОВАНИЕ ЗОН
    // ============================================================
    function drawZones() {
      zoneLayers.forEach(l => map.removeLayer(l));
      labelLayers.forEach(l => map.removeLayer(l));
      zoneLayers = [];
      labelLayers = [];

      allZones.forEach((zone, index) => {
        const isCaptured = capturedZones.has(zone.id);
        const half = zone.size / 2;
        const color = colors[index % colors.length];

        const coords = [
          [zone.lat - half, zone.lng - half],
          [zone.lat - half, zone.lng + half],
          [zone.lat + half, zone.lng + half],
          [zone.lat + half, zone.lng - half],
          [zone.lat - half, zone.lng - half]
        ];

        const polygon = L.polygon(coords, {
          color: isCaptured ? '#2ecc71' : color,
          weight: isCaptured ? 3 : 1.5,
          opacity: isCaptured ? 1 : 0.6,
          fillColor: isCaptured ? '#2ecc71' : color,
          fillOpacity: isCaptured ? 0.4 : 0.15,
          interactive: true,
        });

        polygon.bindPopup(`
          <b>🏛️ Зона ${zone.id}</b><br>
          ${zone.name}<br>
          📍 ${zone.sector}<br>
          ${isCaptured ? '✅ Захвачена' : '⬜ Свободна'}
        `);

        polygon.addTo(map);
        zoneLayers.push(polygon);

        const label = L.marker([zone.lat, zone.lng], {
          icon: L.divIcon({
            className: `zone-label ${isCaptured ? 'captured' : ''}`,
            html: zone.id,
            iconSize: [28, 20],
            iconAnchor: [14, 10]
          }),
          interactive: false
        });
        label.addTo(map);
        labelLayers.push(label);
      });

      updateUI();
    }

    // ============================================================
    // ОБНОВЛЕНИЕ UI
    // ============================================================
    function updateUI() {
      zoneCountSpan.textContent = `🏛️ Зон: ${capturedZones.size}/${allZones.length}`;
      capturedCountSpan.textContent = `✅ Захвачено: ${capturedZones.size}`;

      const totalArea = allZones
        .filter(z => capturedZones.has(z.id))
        .reduce((sum, z) => sum + (z.size * z.size * 111 * 111), 0);

      statsContent.innerHTML = `
        <div class="stat-item">📊 Всего зон: ${allZones.length}</div>
        <div class="stat-item">🏆 Захвачено: ${capturedZones.size}</div>
        <div class="stat-item" style="border-bottom:none;color:#2ecc71;">
          📐 ${Math.round(totalArea)} км²
        </div>
      `;
    }

    // ============================================================
    // КНОПКИ
    // ============================================================
    actionBtn.addEventListener('click', () => {
      if (capturedZones.size < allZones.length) {
        // Захватываем случайную зону для демонстрации
        const available = allZones.filter(z => !capturedZones.has(z.id));
        if (available.length > 0) {
          const random = available[Math.floor(Math.random() * available.length)];
          capturedZones.add(random.id);
          drawZones();
        }
      } else {
        alert('🎉 Все зоны захвачены!');
      }
    });

    resetBtn.addEventListener('click', () => {
      capturedZones.clear();
      drawZones();
    });

    // ============================================================
    // ГЕОЛОКАЦИЯ
    // ============================================================
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          map.setView([pos.coords.latitude, pos.coords.longitude], 14);
          L.marker([pos.coords.latitude, pos.coords.longitude])
            .addTo(map)
            .bindPopup('📍 Вы здесь');
        },
        () => {},
        { enableHighAccuracy: true }
      );
    }

    // ============================================================
    // ЗАПУСК
    // ============================================================
    drawZones();
    console.log('🏃 Карта Нячанга — 27 зон загружена');
  </script>
</body>
</html>
