<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🏃 Захват города — Секции</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, Arial, sans-serif; background: #000; }
    #map { height: 100vh; width: 100vw; }
    
    .info-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-around;
      z-index: 1000;
      font-size: 14px;
      backdrop-filter: blur(10px);
      flex-wrap: wrap;
      gap: 8px;
    }
    .info-panel span { padding: 4px 8px; }
    .badge { 
      background: #4CAF50; 
      border-radius: 20px; 
      padding: 2px 12px !important;
      font-weight: bold;
    }
    .badge-gray { background: #555; }
    
    .controls {
      position: fixed;
      bottom: 50px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 16px;
      z-index: 1000;
    }
    
    button {
      padding: 18px 40px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      color: white;
      background: linear-gradient(135deg, #4CAF50, #45a049);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: 0.3s;
      min-width: 160px;
    }
    button:active { transform: scale(0.95); }
    .stop-btn { background: linear-gradient(135deg, #f44336, #d32f2f); }
    .reset-btn { 
      background: linear-gradient(135deg, #666, #444);
      min-width: 80px;
      padding: 18px 20px;
    }
    
    .legend {
      position: fixed;
      bottom: 130px;
      left: 16px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 12px;
      z-index: 1000;
      backdrop-filter: blur(10px);
      min-width: 120px;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .color-box { width: 20px; height: 20px; border-radius: 4px; border: 1px solid #555; }
    
    .stats {
      position: fixed;
      bottom: 130px;
      right: 16px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 12px;
      z-index: 1000;
      backdrop-filter: blur(10px);
      max-width: 180px;
      max-height: 200px;
      overflow-y: auto;
    }
    .stats h4 { margin-bottom: 6px; border-bottom: 1px solid #555; padding-bottom: 4px; }
    .stat-item { padding: 3px 0; border-bottom: 1px solid #333; font-size: 11px; }
  </style>
</head>
<body>

  <div id="map"></div>
  
  <div class="info-panel" id="infoPanel">
    <span id="pointsCount">📍 0 точек</span>
    <span id="distanceDisplay">📏 0 м</span>
    <span id="sectorCount">🏛️ 0 секций</span>
    <span id="loopStatus" class="badge badge-gray">🔓 Не замкнуто</span>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="color-box" style="background:rgba(76,175,80,0.5);"></div> Твои секции</div>
    <div class="legend-item"><div class="color-box" style="background:rgba(255,68,68,0.5);"></div> Твой маршрут</div>
    <div class="legend-item"><div class="color-box" style="background:rgba(255,255,255,0.1);"></div> Сетка (1 км)</div>
  </div>

  <div class="stats" id="statsPanel">
    <h4>🏅 Захвачено</h4>
    <div id="statsContent">Пока пусто</div>
  </div>

  <div class="controls">
    <button class="reset-btn" id="resetBtn">🗑️</button>
    <button id="actionBtn">🏃 СТАРТ</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ===== НАСТРОЙКИ =====
    const GRID_SIZE = 1000; // 1 км в метрах
    const GRID_DEGREES = GRID_SIZE / 111320; // 1 км ≈ 0.00898 градусов

    // ===== СОСТОЯНИЕ =====
    let map, watchId = null;
    let isRunning = false;
    let route = [];
    let capturedSectors = new Set(); // Храним ключи секций
    let territoryPolygons = [];
    let polyline = null;
    let gridLayer = null;

    // DOM элементы
    const pointsSpan = document.getElementById('pointsCount');
    const distanceSpan = document.getElementById('distanceDisplay');
    const sectorSpan = document.getElementById('sectorCount');
    const loopSpan = document.getElementById('loopStatus');
    const actionBtn = document.getElementById('actionBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statsContent = document.getElementById('statsContent');

    // ===== ИНИЦИАЛИЗАЦИЯ КАРТЫ =====
    map = L.map('map', {
      center: [55.7558, 37.6173],
      zoom: 13,
      zoomControl: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // ===== СОЗДАНИЕ СЕТКИ =====
    function getSectorKey(lat, lng) {
      const x = Math.floor(lng / GRID_DEGREES);
      const y = Math.floor(lat / GRID_DEGREES);
      return `${x},${y}`;
    }

    function getSectorCenter(key) {
      const [x, y] = key.split(',').map(Number);
      return [
        (y + 0.5) * GRID_DEGREES,
        (x + 0.5) * GRID_DEGREES
      ];
    }

    function drawGrid() {
      if (gridLayer) map.removeLayer(gridLayer);
      gridLayer = L.layerGroup();

      const bounds = map.getBounds();
      const latMin = Math.floor(bounds.getSouth() / GRID_DEGREES) * GRID_DEGREES;
      const latMax = Math.ceil(bounds.getNorth() / GRID_DEGREES) * GRID_DEGREES;
      const lngMin = Math.floor(bounds.getWest() / GRID_DEGREES) * GRID_DEGREES;
      const lngMax = Math.ceil(bounds.getEast() / GRID_DEGREES) * GRID_DEGREES;

      for (let lat = latMin; lat <= latMax; lat += GRID_DEGREES) {
        for (let lng = lngMin; lng <= lngMax; lng += GRID_DEGREES) {
          const key = getSectorKey(lat, lng);
          const isCaptured = capturedSectors.has(key);
          
          const rect = L.rectangle(
            [[lat, lng], [lat + GRID_DEGREES, lng + GRID_DEGREES]],
            {
              color: isCaptured ? '#4CAF50' : '#ffffff',
              weight: 1,
              opacity: isCaptured ? 0.8 : 0.2,
              fillColor: isCaptured ? '#4CAF50' : 'transparent',
              fillOpacity: isCaptured ? 0.5 : 0,
              interactive: false
            }
          );
          gridLayer.addLayer(rect);

          // Добавляем подпись с координатами (опционально)
          if (isCaptured) {
            const center = getSectorCenter(key);
            L.marker(center, {
              icon: L.divIcon({
                className: 'sector-label',
                html: '✅',
                iconSize: [20, 20]
              })
            }).addTo(gridLayer);
          }
        }
      }

      gridLayer.addTo(map);
    }

    // ===== ГЕОЛОКАЦИЯ =====
    function updateLocation() {
      if (!navigator.geolocation) {
        alert('Ваш браузер не поддерживает геолокацию');
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          const { latitude, longitude } = pos.coords;
          map.setView([latitude, longitude], 15);
        },
        err => alert('Ошибка GPS: ' + err.message),
        { enableHighAccuracy: true }
      );
    }
    updateLocation();

    // ===== РАСЧЁТ РАССТОЯНИЯ =====
    function calcDistance(points) {
      if (points.length < 2) return 0;
      let total = 0;
      for (let i = 1; i < points.length; i++) {
        total += map.distance(points[i-1], points[i]);
      }
      return total;
    }

    // ===== ПРОВЕРКА ПЕТЛИ =====
    function isLoopClosed(points) {
      if (points.length < 5) return false;
      const first = points[0];
      const last = points[points.length - 1];
      return map.distance(first, last) < 50;
    }

    // ===== ЗАХВАТ СЕКЦИЙ =====
    function captureSectors(points) {
      if (points.length < 3) return;
      
      // Проверяем каждую точку маршрута
      points.forEach(p => {
        const key = getSectorKey(p[0], p[1]);
        if (!capturedSectors.has(key)) {
          capturedSectors.add(key);
        }
      });

      // Также проверяем секции между точками (интерполяция)
      for (let i = 1; i < points.length; i++) {
        const p1 = points[i-1];
        const p2 = points[i];
        const steps = Math.max(3, Math.floor(map.distance(p1, p2) / 100)); // Каждые 100 м
        for (let s = 1; s < steps; s++) {
          const t = s / steps;
          const lat = p1[0] + (p2[0] - p1[0]) * t;
          const lng = p1[1] + (p2[1] - p1[1]) * t;
          const key = getSectorKey(lat, lng);
          if (!capturedSectors.has(key)) {
            capturedSectors.add(key);
          }
        }
      }

      updateUI();
      drawGrid();
    }

    // ===== ОБНОВЛЕНИЕ ИНФОРМАЦИИ =====
    function updateUI() {
      pointsSpan.textContent = '📍 ' + route.length + ' точек';
      distanceSpan.textContent = '📏 ' + Math.round(calcDistance(route)) + ' м';
      sectorSpan.textContent = '🏛️ ' + capturedSectors.size + ' секций';
      
      if (isLoopClosed(route) && route.length > 0) {
        loopSpan.textContent = '🔒 ПЕТЛЯ!';
        loopSpan.className = 'badge';
      } else {
        loopSpan.textContent = '🔓 Не замкнуто';
        loopSpan.className = 'badge badge-gray';
      }

      // Статистика
      statsContent.innerHTML = capturedSectors.size > 0 
        ? `<div class="stat-item">🏆 Захвачено: ${capturedSectors.size} секций</div>
           <div class="stat-item">📐 ~${Math.round(capturedSectors.size * 1)} км²</div>`
        : 'Пока пусто';
    }

    // ===== СТАРТ =====
    function startRun() {
      if (!navigator.geolocation) return;
      
      route = [];
      isRunning = true;
      actionBtn.textContent = '⏹ СТОП';
      actionBtn.className = 'stop-btn';

      if (polyline) { map.removeLayer(polyline); polyline = null; }

      navigator.geolocation.getCurrentPosition(
        pos => {
          const p = [pos.coords.latitude, pos.coords.longitude];
          route.push(p);
          updateUI();
        },
        err => alert('Ошибка GPS: ' + err.message),
        { enableHighAccuracy: true }
      );

      watchId = navigator.geolocation.watchPosition(
        pos => {
          const p = [pos.coords.latitude, pos.coords.longitude];
          route.push(p);
          
          if (polyline) map.removeLayer(polyline);
          polyline = L.polyline(route, { color: '#FF4444', weight: 4 }).addTo(map);
          
          map.setView(p, 17);
          updateUI();
        },
        err => alert('Ошибка GPS: ' + err.message),
        { enableHighAccuracy: true, maximumAge: 2000, timeout: 5000 }
      );
    }

    // ===== СТОП =====
    function stopRun() {
      if (watchId) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      isRunning = false;
      actionBtn.textContent = '🏃 СТАРТ';
      actionBtn.className = '';

      if (route.length < 5) {
        alert('❌ Слишком короткий маршрут');
        return;
      }

      if (isLoopClosed(route)) {
        captureSectors(route);
        alert('🏆 Территория захвачена!\nСекций: ' + capturedSectors.size);
      } else {
        alert('❌ Маршрут не замкнут!\nВернись в точку старта (< 50 м)');
      }
      
      updateUI();
    }

    // ===== СБРОС =====
    function resetGame() {
      if (isRunning) {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        isRunning = false;
        actionBtn.textContent = '🏃 СТАРТ';
        actionBtn.className = '';
      }
      capturedSectors.clear();
      route = [];
      if (polyline) { map.removeLayer(polyline); polyline = null; }
      updateUI();
      drawGrid();
      alert('🗑️ Все секции сброшены');
    }

    // ===== КНОПКИ =====
    actionBtn.addEventListener('click', () => {
      if (!isRunning) {
        startRun();
      } else {
        stopRun();
      }
    });

    resetBtn.addEventListener('click', resetGame);

    // ===== ОБНОВЛЕНИЕ СЕТКИ ПРИ ПЕРЕМЕЩЕНИИ =====
    map.on('moveend', drawGrid);

    // ===== ПРИ ЗАГРУЗКЕ =====
    setTimeout(drawGrid, 500);
    updateUI();
  </script>
</body>
</html>
