<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Захват города</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; }
    body { font-family: Arial; }
    #map { height: 100vh; width: 100vw; }
    .controls {
      position: fixed;
      bottom: 40px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 20px;
      z-index: 1000;
    }
    button {
      padding: 16px 40px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      color: white;
      background: #4CAF50;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .stop { background: #f44336; }
    .info {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 16px;
      border-radius: 12px;
      z-index: 1000;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="info" id="info">📍 0 точек | 📏 0 м</div>
  <div class="controls">
    <button id="startBtn">🏃 СТАРТ</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, watchId, route = [], isRunning = false;
    let startMarker, polyline;
    const info = document.getElementById('info');
    const startBtn = document.getElementById('startBtn');

    // Инициализация карты
    map = L.map('map').setView([55.75, 37.61], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Геолокация
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          const { latitude, longitude } = pos.coords;
          map.setView([latitude, longitude], 17);
          L.marker([latitude, longitude]).addTo(map).bindPopup('Вы здесь');
        },
        err => alert('Ошибка GPS: ' + err.message)
      );
    }

    function calcDistance(points) {
      if (points.length < 2) return 0;
      let total = 0;
      for (let i = 1; i < points.length; i++) {
        total += map.distance(points[i-1], points[i]);
      }
      return total;
    }

    function isLoopClosed(points) {
      if (points.length < 5) return false;
      const first = points[0];
      const last = points[points.length - 1];
      return map.distance(first, last) < 50;
    }

    startBtn.addEventListener('click', () => {
      if (!isRunning) {
        // СТАРТ
        route = [];
        isRunning = true;
        startBtn.textContent = '⏹ СТОП';
        startBtn.className = 'stop';

        if (polyline) map.removeLayer(polyline);
        if (startMarker) map.removeLayer(startMarker);

        navigator.geolocation.getCurrentPosition(
          pos => {
            const p = [pos.coords.latitude, pos.coords.longitude];
            route.push(p);
            startMarker = L.marker(p).addTo(map).bindPopup('Старт');
          },
          err => alert(err.message)
        );

        watchId = navigator.geolocation.watchPosition(
          pos => {
            const p = [pos.coords.latitude, pos.coords.longitude];
            route.push(p);
            if (polyline) map.removeLayer(polyline);
            polyline = L.polyline(route, { color: 'red', weight: 4 }).addTo(map);
            map.setView(p, 17);
            info.textContent = `📍 ${route.length} точек | 📏 ${Math.round(calcDistance(route))} м`;
          },
          err => alert(err.message)
        );
      } else {
        // СТОП
        if (watchId) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }
        isRunning = false;
        startBtn.textContent = '🏃 СТАРТ';
        startBtn.className = '';

        if (isLoopClosed(route)) {
          alert('🏆 Территория захвачена! Площадь: ~' + 
            Math.round(L.polygon(route).getArea()) + ' м²');
        } else {
          alert('❌ Маршрут не замкнут. Вернись в точку старта (< 50 м)');
        }
      }
    });
  </script>
</body>
</html>
