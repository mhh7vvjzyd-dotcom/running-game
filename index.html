<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🏃 Нячанг — Захват зон</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, Arial, sans-serif; }
    #map { height: 100vh; width: 100vw; }
    
    .info-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-around;
      z-index: 1000;
      font-size: 13px;
      backdrop-filter: blur(10px);
      flex-wrap: wrap;
      gap: 6px;
    }
    .badge-green { background: #4CAF50; border-radius: 20px; padding: 2px 12px; font-weight: bold; }
    .badge-gray { background: #555; border-radius: 20px; padding: 2px 12px; }
    .badge-red { background: #f44336; border-radius: 20px; padding: 2px 12px; }
    
    .controls {
      position: fixed;
      bottom: 50px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 16px;
      z-index: 1000;
    }
    
    button {
      padding: 18px 40px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      color: white;
      background: linear-gradient(135deg, #4CAF50, #45a049);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: 0.3s;
      min-width: 160px;
    }
    button:active { transform: scale(0.95); }
    .stop-btn { background: linear-gradient(135deg, #f44336, #d32f2f); }
    .reset-btn { 
      background: linear-gradient(135deg, #666, #444);
      min-width: 60px;
      padding: 18px 20px;
    }
    
    .stats {
      position: fixed;
      bottom: 130px;
      right: 16px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 12px;
      z-index: 1000;
      backdrop-filter: blur(10px);
      max-width: 180px;
    }
    .stats h4 { margin-bottom: 6px; border-bottom: 1px solid #555; padding-bottom: 4px; }
    .stat-item { padding: 3px 0; border-bottom: 1px solid #333; font-size: 11px; }
  </style>
</head>
<body>

  <div id="map"></div>
  
  <div class="info-panel" id="infoPanel">
    <span id="pointsCount">📍 0 точек</span>
    <span id="distanceDisplay">📏 0 м</span>
    <span id="zoneCount">🏛️ 0/41 зон</span>
    <span id="loopStatus" class="badge-gray">🔓 Не замкнуто</span>
  </div>

  <div class="stats" id="statsPanel">
    <h4>🏅 Захвачено</h4>
    <div id="statsContent">Пока пусто</div>
  </div>

  <div class="controls">
    <button class="reset-btn" id="resetBtn">🗑️</button>
    <button id="actionBtn">🏃 СТАРТ</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ===== КООРДИНАТЫ НЯЧАНГА =====
    const NHA_TRANG = { lat: 12.2388, lng: 109.1967 };
    
    // ===== ГЕНЕРАЦИЯ 41 ЗОНЫ =====
    function generateZones() {
      const zones = [];
      let id = 1;
      
      // Размеры зон (в км)
      const sizes = {
        center: { min: 2, max: 3.5, count: 8 },
        north: { min: 3, max: 5, count: 10 },
        south: { min: 3, max: 5.5, count: 9 },
        west: { min: 3, max: 6, count: 7 },
        east: { min: 3, max: 7, count: 7 }
      };
      
      // Смещения от центра (в градусах)
      const offsets = {
        center: { lat: 0, lng: 0 },
        north: { lat: 0.08, lng: 0 },
        south: { lat: -0.08, lng: 0 },
        west: { lat: 0, lng: -0.08 },
        east: { lat: 0, lng: 0.08 }
      };
      
      // Генерируем зоны для каждого сектора
      Object.entries(sizes).forEach(([sector, data]) => {
        const offset = offsets[sector];
        const baseLat = NHA_TRANG.lat + offset.lat;
        const baseLng = NHA_TRANG.lng + offset.lng;
        
        for (let i = 0; i < data.count; i++) {
          // Случайный размер в пределах сектора
          const size = data.min + Math.random() * (data.max - data.min);
          const sizeDeg = size / 111;
          
          // Случайное смещение внутри сектора
          const angle = Math.random() * 2 * Math.PI;
          const radius = 0.015 + Math.random() * 0.025;
          const latOff = Math.cos(angle) * radius;
          const lngOff = Math.sin(angle) * radius;
          
          const centerLat = baseLat + latOff;
          const centerLng = baseLng + lngOff;
          
          // Создаём прямоугольную зону
          const half = sizeDeg / 2;
          const coords = [
            [centerLat - half, centerLng - half],
            [centerLat - half, centerLng + half],
            [centerLat + half, centerLng + half],
            [centerLat + half, centerLng - half],
            [centerLat - half, centerLng - half] // замыкаем
          ];
          
          zones.push({
            id: id.toString().padStart(2, '0'),
            name: id.toString().padStart(2, '0'),
            sector: sector,
            area: Math.round(size * size * 100) / 100,
            perimeter: Math.round(size * 4 * 100) / 100,
            coords: coords,
            center: [centerLat, centerLng],
            status: 'free',
            owner: null
          });
          id++;
        }
      });
      
      return zones;
    }

    // ===== СОЗДАЁМ ЗОНЫ =====
    const allZones = generateZones();
    let capturedZones = new Set(); // номера захваченных зон

    // ===== КАРТА =====
    let map = L.map('map', {
      center: [NHA_TRANG.lat, NHA_TRANG.lng],
      zoom: 13
    });
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // ===== СОСТОЯНИЕ ИГРЫ =====
    let isRunning = false;
    let route = [];
    let watchId = null;
    let polyline = null;
    let zoneLayers = [];

    // DOM
    const pointsSpan = document.getElementById('pointsCount');
    const distanceSpan = document.getElementById('distanceDisplay');
    const zoneCountSpan = document.getElementById('zoneCount');
    const loopSpan = document.getElementById('loopStatus');
    const actionBtn = document.getElementById('actionBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statsContent = document.getElementById('statsContent');

    // ===== РИСУЕМ ЗОНЫ =====
    function drawZones() {
      // Удаляем старые слои
      zoneLayers.forEach(l => map.removeLayer(l));
      zoneLayers = [];

      allZones.forEach(zone => {
        const isCaptured = capturedZones.has(zone.id);
        
        const polygon = L.polygon(zone.coords, {
          color: isCaptured ? '#4CAF50' : 'rgba(255,255,255,0.3)',
          weight: isCaptured ? 3 : 1,
          opacity: isCaptured ? 1 : 0.5,
          fillColor: isCaptured ? '#4CAF50' : 'rgba(255,255,255,0.1)',
          fillOpacity: isCaptured ? 0.5 : 0.1,
          interactive: true
        });

        // Добавляем всплывашку с номером
        polygon.bindPopup(`
          <b>Зона ${zone.id}</b><br>
          Сектор: ${zone.sector}<br>
          Площадь: ${zone.area} км²<br>
          Статус: ${isCaptured ? '✅ Захвачена' : '⬜ Свободна'}
        `);

        polygon.addTo(map);
        zoneLayers.push(polygon);

        // Добавляем номер зоны на карту
        const label = L.marker(zone.center, {
          icon: L.divIcon({
            className: 'zone-label',
            html: `<div style="
              background: ${isCaptured ? 'rgba(76,175,80,0.9)' : 'rgba(0,0,0,0.6)'};
              color: white;
              border-radius: 50%;
              width: 24px;
              height: 24px;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 11px;
              font-weight: bold;
              border: 2px solid ${isCaptured ? '#4CAF50' : '#666'};
            ">${zone.id}</div>`,
            iconSize: [24, 24]
          })
        });
        label.addTo(map);
        zoneLayers.push(label);
      });

      updateUI();
    }

    // ===== ПРОВЕРКА ЗАХВАТА ЗОН =====
    function checkZoneCapture(points) {
      if (points.length < 3) return;
      
      // Создаём полигон маршрута
      const routePolygon = L.polygon([...points, points[0]]);
      
      allZones.forEach(zone => {
        if (capturedZones.has(zone.id)) return;
        
        const zonePolygon = L.polygon(zone.coords);
        
        // Проверяем, пересекаются ли полигоны
        if (routePolygon.getBounds().intersects(zonePolygon.getBounds())) {
          // Дополнительная проверка: центр зоны внутри маршрута
          const center = zone.center;
          if (pointInPolygon(center, points)) {
            capturedZones.add(zone.id);
          }
        }
      });
      
      drawZones();
      updateUI();
    }

    // ===== ПРОВЕРКА ТОЧКИ ВНУТРИ ПОЛИГОНА =====
    function pointInPolygon(point, polygon) {
      let inside = false;
      const x = point[1], y = point[0];
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const xi = polygon[i][1], yi = polygon[i][0];
        const xj = polygon[j][1], yj = polygon[j][0];
        const intersect = ((yi > y) !== (yj > y)) &&
          (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    // ===== РАСЧЁТЫ =====
    function calcDistance(points) {
      if (points.length < 2) return 0;
      let total = 0;
      for (let i = 1; i < points.length; i++) {
        total += map.distance(points[i-1], points[i]);
      }
      return total;
    }

    function isLoopClosed(points) {
      if (points.length < 5) return false;
      return map.distance(points[0], points[points.length-1]) < 50;
    }

    // ===== ОБНОВЛЕНИЕ UI =====
    function updateUI() {
      pointsSpan.textContent = '📍 ' + route.length + ' точек';
      distanceSpan.textContent = '📏 ' + Math.round(calcDistance(route)) + ' м';
      zoneCountSpan.textContent = '🏛️ ' + capturedZones.size + '/41 зон';
      
      if (isLoopClosed(route) && route.length > 0) {
        loopSpan.textContent = '🔒 ПЕТЛЯ!';
        loopSpan.className = 'badge-green';
      } else {
        loopSpan.textContent = '🔓 Не замкнуто';
        loopSpan.className = 'badge-gray';
      }

      const totalArea = allZones
        .filter(z => capturedZones.has(z.id))
        .reduce((sum, z) => sum + z.area, 0);

      statsContent.innerHTML = capturedZones.size > 0 
        ? `<div class="stat-item">🏆 Зон: ${capturedZones.size}/41</div>
           <div class="stat-item">📐 Площадь: ${Math.round(totalArea)} км²</div>`
        : 'Пока пусто';
    }

    // ===== ГЕОЛОКАЦИЯ =====
    function updateLocation() {
      if (!navigator.geolocation) return alert('Нет GPS');
      navigator.geolocation.getCurrentPosition(
        pos => {
          const { latitude, longitude } = pos.coords;
          map.setView([latitude, longitude], 15);
        },
        () => {},
        { enableHighAccuracy: true }
      );
    }
    updateLocation();

    // ===== СТАРТ =====
    function startRun() {
      route = [];
      isRunning = true;
      actionBtn.textContent = '⏹ СТОП';
      actionBtn.className = 'stop-btn';
      if (polyline) { map.removeLayer(polyline); polyline = null; }

      navigator.geolocation.getCurrentPosition(
        pos => {
          route.push([pos.coords.latitude, pos.coords.longitude]);
          updateUI();
        },
        () => {},
        { enableHighAccuracy: true }
      );

      watchId = navigator.geolocation.watchPosition(
        pos => {
          const p = [pos.coords.latitude, pos.coords.longitude];
          route.push(p);
          if (polyline) map.removeLayer(polyline);
          polyline = L.polyline(route, { color: '#FF4444', weight: 4 }).addTo(map);
          map.setView(p, 17);
          updateUI();
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 2000 }
      );
    }

    // ===== СТОП =====
    function stopRun() {
      if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      isRunning = false;
      actionBtn.textContent = '🏃 СТАРТ';
      actionBtn.className = '';

      if (route.length < 5) return alert('❌ Слишком короткий маршрут');

      if (isLoopClosed(route)) {
        checkZoneCapture(route);
        alert('🏆 Захвачено ' + capturedZones.size + ' зон из 41!');
      } else {
        alert('❌ Вернись в точку старта (< 50 м)');
      }
      updateUI();
    }

    // ===== СБРОС =====
    function resetGame() {
      if (isRunning) {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        isRunning = false;
        actionBtn.textContent = '🏃 СТАРТ';
        actionBtn.className = '';
      }
      capturedZones.clear();
      route = [];
      if (polyline) { map.removeLayer(polyline); polyline = null; }
      drawZones();
      updateUI();
    }

    // ===== КНОПКИ =====
    actionBtn.addEventListener('click', () => isRunning ? stopRun() : startRun());
    resetBtn.addEventListener('click', resetGame);

    // ===== ЗАПУСК =====
    drawZones();
    updateUI();
  </script>
</body>
</html>
