<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🏃 Нячанг — Точные границы</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, Arial, sans-serif; background: #0f0f1a; }
    #map { height: 100vh; width: 100vw; }
    .info-panel {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      background: rgba(0,0,0,0.88);
      color: white;
      padding: 10px 14px;
      border-radius: 14px;
      display: flex;
      justify-content: space-around;
      z-index: 1000;
      font-size: 11px;
      backdrop-filter: blur(12px);
      flex-wrap: wrap;
      gap: 4px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .badge-green { background: #2ecc71; border-radius: 20px; padding: 2px 12px; font-weight: bold; }
    .badge-gray { background: #555; border-radius: 20px; padding: 2px 12px; }
    .controls {
      position: fixed;
      bottom: 40px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 1000;
    }
    button {
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      color: white;
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      box-shadow: 0 4px 20px rgba(46,204,113,0.3);
      cursor: pointer;
      transition: 0.3s;
      min-width: 140px;
    }
    button:active { transform: scale(0.95); }
    .stop-btn { background: linear-gradient(135deg, #e74c3c, #c0392b); }
    .reset-btn {
      background: linear-gradient(135deg, #555, #333);
      min-width: 56px;
      padding: 16px 18px;
    }
    .stats {
      position: fixed;
      bottom: 120px;
      right: 16px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 12px;
      z-index: 1000;
      backdrop-filter: blur(10px);
      max-width: 170px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .stats h4 { margin-bottom: 6px; border-bottom: 1px solid #444; padding-bottom: 4px; }
    .stat-item { padding: 3px 0; border-bottom: 1px solid #2a2a2a; font-size: 11px; }
    .zone-label {
      background: rgba(0,0,0,0.8);
      color: white;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: bold;
      border: 2px solid rgba(255,255,255,0.3);
      text-align: center;
      pointer-events: none;
      font-family: monospace;
      text-shadow: 0 0 12px rgba(0,0,0,0.9);
    }
    .zone-label.captured {
      background: rgba(46,204,113,0.9);
      border-color: #2ecc71;
      box-shadow: 0 0 30px rgba(46,204,113,0.3);
    }
    .region-label {
      color: white;
      font-size: 11px;
      font-weight: bold;
      text-shadow: 0 0 15px rgba(0,0,0,0.95);
      background: rgba(0,0,0,0.6);
      padding: 4px 12px;
      border-radius: 10px;
      border-left: 4px solid #f1c40f;
      backdrop-filter: blur(4px);
      white-space: nowrap;
    }
    .region-label.captured-label {
      border-left-color: #2ecc71;
      background: rgba(46,204,113,0.2);
    }
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 18px;
      z-index: 9999;
      background: rgba(0,0,0,0.8);
      padding: 20px 40px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="loading" id="loading">⏳ Загрузка карты...</div>
  
  <div class="info-panel" id="infoPanel" style="display:none;">
    <span id="pointsCount">📍 0</span>
    <span id="distanceDisplay">📏 0 м</span>
    <span id="zoneCount">🏛️ 0/0</span>
    <span id="loopStatus" class="badge-gray">🔓 Не замкнуто</span>
  </div>
  <div class="stats" id="statsPanel" style="display:none;">
    <h4>🏅 Захвачено</h4>
    <div id="statsContent">⬜ Ни одной</div>
  </div>
  <div class="controls" id="controls" style="display:none;">
    <button class="reset-btn" id="resetBtn">🗑️</button>
    <button id="actionBtn">🏃 СТАРТ</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ============================================================
    // ЗАГРУЗКА РЕАЛЬНЫХ ГРАНИЦ ИЗ GEOJSON
    // ============================================================
    const loading = document.getElementById('loading');
    const infoPanel = document.getElementById('infoPanel');
    const statsPanel = document.getElementById('statsPanel');
    const controls = document.getElementById('controls');

    // Карта
    const map = L.map('map', {
      center: [12.250, 109.210],
      zoom: 13,
      zoomControl: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // ============================================================
    // СОСТОЯНИЕ
    // ============================================================
    let capturedZones = new Set();
    let isRunning = false;
    let route = [];
    let watchId = null;
    let polyline = null;
    let zoneLayers = [];
    let labelLayers = [];
    let allZones = [];

    // DOM
    const pointsSpan = document.getElementById('pointsCount');
    const distanceSpan = document.getElementById('distanceDisplay');
    const zoneCountSpan = document.getElementById('zoneCount');
    const loopSpan = document.getElementById('loopStatus');
    const actionBtn = document.getElementById('actionBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statsContent = document.getElementById('statsContent');

    // ============================================================
    // ЗАГРУЗКА ДАННЫХ
    // ============================================================
    async function loadData() {
      try {
        const response = await fetch(
          'https://raw.githubusercontent.com/daohoangson/dvhcvn/master/data/gis/56.json'
        );
        const data = await response.json();

        // Ищем город Нячанг (код 568)
        const nhaTrang = data['56'].level2s.find(l => l.level2_id === '568');
        if (!nhaTrang) {
          loading.textContent = '❌ Город Нячанг не найден';
          return;
        }

        // Извлекаем координаты районов (level3s)
        if (!nhaTrang.level3s) {
          loading.textContent = '❌ Районы не найдены';
          return;
        }

        allZones = nhaTrang.level3s.map((district, index) => {
          const coords = district.coordinates[0].map(coord => [coord[1], coord[0]]);
          const center = coords.reduce(
            (acc, p) => [acc[0] + p[0] / coords.length, acc[1] + p[1] / coords.length],
            [0, 0]
          );
          return {
            id: String(index + 1).padStart(2, '0'),
            name: district.name,
            center: center,
            coords: coords
          };
        });

        loading.textContent = `✅ Загружено ${allZones.length} районов`;
        setTimeout(() => {
          loading.style.display = 'none';
          infoPanel.style.display = 'flex';
          statsPanel.style.display = 'block';
          controls.style.display = 'flex';
          drawZones();
          updateUI();
        }, 500);

      } catch (e) {
        loading.textContent = '❌ Ошибка загрузки: ' + e.message;
        console.error(e);
      }
    }

    // ============================================================
    // РИСОВАНИЕ ЗОН
    // ============================================================
    function drawZones() {
      zoneLayers.forEach(l => map.removeLayer(l));
      labelLayers.forEach(l => map.removeLayer(l));
      zoneLayers = [];
      labelLayers = [];

      const colors = ['#3498db','#2ecc71','#e74c3c','#f39c12','#9b59b6','#1abc9c','#e67e22','#2c3e50'];

      allZones.forEach((zone, index) => {
        const isCaptured = capturedZones.has(zone.id);
        const color = colors[index % colors.length];

        const polygon = L.polygon(zone.coords, {
          color: isCaptured ? '#2ecc71' : color,
          weight: isCaptured ? 3 : 1.5,
          opacity: isCaptured ? 1 : 0.5,
          fillColor: isCaptured ? '#2ecc71' : color,
          fillOpacity: isCaptured ? 0.35 : 0.1,
          interactive: true,
        });

        polygon.bindPopup(`
          <b>🏛️ ${zone.name}</b><br>
          ${isCaptured ? '✅ Захвачена' : '⬜ Свободна'}
        `);

        polygon.addTo(map);
        zoneLayers.push(polygon);

        const label = L.marker(zone.center, {
          icon: L.divIcon({
            className: `zone-label ${isCaptured ? 'captured' : ''}`,
            html: zone.id,
            iconSize: [26, 20],
            iconAnchor: [13, 10]
          }),
          interactive: false
        });
        label.addTo(map);
        labelLayers.push(label);
      });

      // Центрируем карту по первому району
      if (allZones.length > 0) {
        map.setView(allZones[0].center, 13);
      }
    }

    // ============================================================
    // ПРОВЕРКА ЗАХВАТА
    // ============================================================
    function checkZoneCapture(points) {
      if (points.length < 3) return;

      const routePolygon = L.polygon([...points, points[0]]);
      const routeBounds = routePolygon.getBounds();

      allZones.forEach(zone => {
        if (capturedZones.has(zone.id)) return;

        const zonePolygon = L.polygon(zone.coords);
        if (routeBounds.intersects(zonePolygon.getBounds())) {
          if (pointInPolygon(zone.center, points)) {
            capturedZones.add(zone.id);
          }
        }
      });

      drawZones();
      updateUI();
    }

    // ============================================================
    // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================
    function pointInPolygon(point, polygon) {
      let inside = false;
      const x = point[1], y = point[0];
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const xi = polygon[i][1], yi = polygon[i][0];
        const xj = polygon[j][1], yj = polygon[j][0];
        const intersect = ((yi > y) !== (yj > y)) &&
          (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function calcDistance(points) {
      if (points.length < 2) return 0;
      let total = 0;
      for (let i = 1; i < points.length; i++) {
        total += map.distance(points[i-1], points[i]);
      }
      return total;
    }

    function isLoopClosed(points) {
      if (points.length < 5) return false;
      return map.distance(points[0], points[points.length-1]) < 50;
    }

    // ============================================================
    // ОБНОВЛЕНИЕ UI
    // ============================================================
    function updateUI() {
      pointsSpan.textContent = '📍 ' + route.length;
      distanceSpan.textContent = '📏 ' + Math.round(calcDistance(route)) + ' м';
      zoneCountSpan.textContent = '🏛️ ' + capturedZones.size + '/' + allZones.length;

      if (isLoopClosed(route) && route.length > 0) {
        loopSpan.textContent = '🔒 ПЕТЛЯ!';
        loopSpan.className = 'badge-green';
      } else {
        loopSpan.textContent = '🔓 Не замкнуто';
        loopSpan.className = 'badge-gray';
      }

      statsContent.innerHTML = capturedZones.size > 0
        ? `<div class="stat-item">🏆 Зон: ${capturedZones.size}/${allZones.length}</div>
           <div class="stat-item" style="border-bottom:none;color:#2ecc71;">${Math.round(capturedZones.size / allZones.length * 100)}% города</div>`
        : '⬜ Ни одной';
    }

    // ============================================================
    // УПРАВЛЕНИЕ БЕГОМ
    // ============================================================
    function startRun() {
      route = [];
      isRunning = true;
      actionBtn.textContent = '⏹ СТОП';
      actionBtn.className = 'stop-btn';
      if (polyline) { map.removeLayer(polyline); polyline = null; }

      navigator.geolocation.getCurrentPosition(
        pos => {
          route.push([pos.coords.latitude, pos.coords.longitude]);
          updateUI();
        },
        () => {},
        { enableHighAccuracy: true }
      );

      watchId = navigator.geolocation.watchPosition(
        pos => {
          const p = [pos.coords.latitude, pos.coords.longitude];
          route.push(p);
          if (polyline) map.removeLayer(polyline);
          polyline = L.polyline(route, { color: '#e74c3c', weight: 4, opacity: 0.9 }).addTo(map);
          map.setView(p, 15);
          updateUI();
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 2000 }
      );
    }

    function stopRun() {
      if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      isRunning = false;
      actionBtn.textContent = '🏃 СТАРТ';
      actionBtn.className = '';

      if (route.length < 5) {
        alert('❌ Слишком короткий маршрут');
        return;
      }

      if (isLoopClosed(route)) {
        checkZoneCapture(route);
        const count = capturedZones.size;
        alert(`🏆 Захвачено ${count} зон из ${allZones.length}!`);
        if (count === allZones.length) alert('🎉 ТЫ ЗАХВАТИЛ ВЕСЬ НЯЧАНГ!');
      } else {
        alert('❌ Маршрут не замкнут! Вернись в старт (< 50 м)');
      }
      updateUI();
    }

    function resetGame() {
      if (isRunning) {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        isRunning = false;
        actionBtn.textContent = '🏃 СТАРТ';
        actionBtn.className = '';
      }
      capturedZones.clear();
      route = [];
      if (polyline) { map.removeLayer(polyline); polyline = null; }
      drawZones();
      updateUI();
    }

    // ============================================================
    // КНОПКИ
    // ============================================================
    actionBtn.addEventListener('click', () => isRunning ? stopRun() : startRun());
    resetBtn.addEventListener('click', resetGame);

    // ============================================================
    // ЗАПУСК
    // ============================================================
    loadData();

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => map.setView([pos.coords.latitude, pos.coords.longitude], 13),
        () => {},
        { enableHighAccuracy: true }
      );
    }

    console.log('🏃 Нячанг — Загрузка реальных границ из GeoJSON');
  </script>
</body>
</html>
