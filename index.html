<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🏃 Нячанг — Зоны</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, Arial, sans-serif; background: #0f0f1a; }
    #map { height: 100vh; width: 100vw; }
    
    .info-panel {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 10px 16px;
      border-radius: 14px;
      display: flex;
      justify-content: space-around;
      z-index: 1000;
      font-size: 12px;
      backdrop-filter: blur(12px);
      flex-wrap: wrap;
      gap: 6px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .badge-green { background: #2ecc71; border-radius: 20px; padding: 2px 12px; font-weight: bold; }
    .badge-gray { background: #555; border-radius: 20px; padding: 2px 12px; }
    
    .controls {
      position: fixed;
      bottom: 40px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 1000;
    }
    
    button {
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      color: white;
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      box-shadow: 0 4px 20px rgba(46,204,113,0.3);
      cursor: pointer;
      transition: 0.3s;
      min-width: 140px;
    }
    button:active { transform: scale(0.95); }
    .reset-btn {
      background: linear-gradient(135deg, #555, #333);
      min-width: 56px;
      padding: 16px 18px;
    }
    
    .stats {
      position: fixed;
      bottom: 120px;
      right: 16px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 12px;
      z-index: 1000;
      backdrop-filter: blur(10px);
      max-width: 190px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .stats h4 { margin-bottom: 6px; border-bottom: 1px solid #444; padding-bottom: 4px; }
    .stat-item { padding: 3px 0; border-bottom: 1px solid #2a2a2a; font-size: 11px; }

    .zone-label {
      background: rgba(0,0,0,0.8);
      color: white;
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid rgba(255,255,255,0.3);
      text-align: center;
      pointer-events: none;
      font-family: monospace;
      text-shadow: 0 0 12px rgba(0,0,0,0.9);
    }
    .zone-label.captured {
      background: rgba(46,204,113,0.9);
      border-color: #2ecc71;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="info-panel" id="infoPanel">
    <span id="zoneCount">🏛️ Зон: 0/2</span>
    <span id="capturedCount">✅ Захвачено: 0</span>
    <span id="totalDistance">📏 Всего: 0 м</span>
  </div>

  <div class="stats" id="statsPanel">
    <h4>📊 Статистика</h4>
    <div id="statsContent">Выбери зону</div>
  </div>

  <div class="controls">
    <button class="reset-btn" id="resetBtn">🗑️</button>
    <button id="actionBtn">🏃 СТАРТ</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ============================================================
    // РАСЧЁТ ПЕРИМЕТРА (дистанция по границе)
    // ============================================================
    function calcPerimeter(coords) {
      if (coords.length < 2) return 0;
      let total = 0;
      for (let i = 0; i < coords.length - 1; i++) {
        total += map.distance(coords[i], coords[i + 1]);
      }
      // Замыкаем: последняя → первая
      total += map.distance(coords[coords.length - 1], coords[0]);
      return Math.round(total);
    }

    // ============================================================
    // ЗОНЫ
    // ============================================================
    const zonesData = [
      {
        id: '01',
        name: 'Vĩnh Hải',
        sector: 'Центр',
        color: '#3498db',
        coords: [
          [12.2959054, 109.2216405],
          [12.2951267, 109.2177517],
          [12.2923235, 109.2125609],
          [12.2921000, 109.2110000],
          [12.2924772, 109.2094382],
          [12.2941344, 109.2126608],
          [12.2956220, 109.2136707],
          [12.2972075, 109.2161775],
          [12.2974191, 109.2184759]
        ]
      },
      {
        id: '02',
        name: 'Vĩnh Phước',
        sector: 'Север',
        color: '#e67e22',
        coords: [
          [12.3000000, 109.2200000],
          [12.2990000, 109.2160000],
          [12.2975000, 109.2130000],
          [12.2960000, 109.2100000],
          [12.2980000, 109.2080000],
          [12.3005000, 109.2100000],
          [12.3015000, 109.2140000],
          [12.3010000, 109.2180000]
        ]
      }
    ];

    // ============================================================
    // КАРТА
    // ============================================================
    const map = L.map('map', {
      center: [12.296, 109.216],
      zoom: 15,
      zoomControl: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // ============================================================
    // СОСТОЯНИЕ
    // ============================================================
    let capturedZones = new Set();
    let zoneLayers = [];
    let labelLayers = [];

    const zoneCountSpan = document.getElementById('zoneCount');
    const capturedCountSpan = document.getElementById('capturedCount');
    const totalDistanceSpan = document.getElementById('totalDistance');
    const statsContent = document.getElementById('statsContent');
    const actionBtn = document.getElementById('actionBtn');
    const resetBtn = document.getElementById('resetBtn');

    // ============================================================
    // РИСОВАНИЕ ЗОН
    // ============================================================
    function drawZones() {
      zoneLayers.forEach(l => map.removeLayer(l));
      labelLayers.forEach(l => map.removeLayer(l));
      zoneLayers = [];
      labelLayers = [];

      zonesData.forEach((zone) => {
        const isCaptured = capturedZones.has(zone.id);
        const perimeter = calcPerimeter(zone.coords);

        const polygon = L.polygon(zone.coords, {
          color: isCaptured ? '#2ecc71' : zone.color,
          weight: isCaptured ? 3 : 2,
          opacity: isCaptured ? 1 : 0.7,
          fillColor: isCaptured ? '#2ecc71' : zone.color,
          fillOpacity: isCaptured ? 0.4 : 0.15,
          interactive: true,
        });

        polygon.bindPopup(`
          <b>🏛️ Зона ${zone.id}</b><br>
          ${zone.name}<br>
          📍 ${zone.sector}<br>
          📏 Периметр: ${perimeter} м<br>
          ${isCaptured ? '✅ Захвачена' : '⬜ Свободна'}
        `);

        polygon.on('click', () => {
          statsContent.innerHTML = `
            <div class="stat-item">🏛️ Зона ${zone.id}</div>
            <div class="stat-item">📍 ${zone.name}</div>
            <div class="stat-item">📐 Сектор: ${zone.sector}</div>
            <div class="stat-item" style="border-bottom:none;color:#f1c40f;">
              🏃 Периметр: ${perimeter} м
            </div>
          `;
        });

        polygon.addTo(map);
        zoneLayers.push(polygon);

        const center = zone.coords.reduce(
          (acc, p) => [acc[0] + p[0] / zone.coords.length, acc[1] + p[1] / zone.coords.length],
          [0, 0]
        );

        const label = L.marker(center, {
          icon: L.divIcon({
            className: `zone-label ${isCaptured ? 'captured' : ''}`,
            html: zone.id,
            iconSize: [40, 30],
            iconAnchor: [20, 15]
          }),
          interactive: false
        });
        label.addTo(map);
        labelLayers.push(label);

        // Нумерованные точки
        zone.coords.forEach((p, i) => {
          L.marker(p, {
            icon: L.divIcon({
              className: 'point-label',
              html: `<div style="
                background: rgba(0,0,0,0.7);
                color: white;
                border-radius: 50%;
                width: 20px;
                height: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 9px;
                font-weight: bold;
                border: 2px solid ${zone.color};
              ">${i + 1}</div>`,
              iconSize: [20, 20],
              iconAnchor: [10, 10]
            }),
            interactive: false
          }).addTo(map);
        });
      });

      updateUI();
    }

    // ============================================================
    // ОБНОВЛЕНИЕ UI
    // ============================================================
    function updateUI() {
      const total = zonesData.length;
      const captured = capturedZones.size;
      zoneCountSpan.textContent = `🏛️ Зон: ${captured}/${total}`;
      capturedCountSpan.textContent = `✅ Захвачено: ${captured}`;

      // Суммарный периметр захваченных зон
      let totalPerimeter = 0;
      zonesData.forEach(z => {
        if (capturedZones.has(z.id)) {
          totalPerimeter += calcPerimeter(z.coords);
        }
      });
      totalDistanceSpan.textContent = `📏 Всего: ${totalPerimeter} м`;

      if (captured === 0) {
        statsContent.innerHTML = '⬜ Кликни на зону';
      }
    }

    // ============================================================
    // КНОПКИ
    // ============================================================
    actionBtn.addEventListener('click', () => {
      // Захватываем первую свободную зону
      const available = zonesData.filter(z => !capturedZones.has(z.id));
      if (available.length > 0) {
        capturedZones.add(available[0].id);
        drawZones();
        updateUI();
        // Показываем периметр захваченной зоны
        const perim = calcPerimeter(available[0].coords);
        statsContent.innerHTML = `
          <div class="stat-item">🏛️ Захвачена зона ${available[0].id}</div>
          <div class="stat-item">📍 ${available[0].name}</div>
          <div class="stat-item" style="border-bottom:none;color:#2ecc71;">
            🏃 Нужно пробежать: ${perim} м
          </div>
        `;
      } else {
        alert('🎉 Все зоны захвачены!');
      }
    });

    resetBtn.addEventListener('click', () => {
      capturedZones.clear();
      drawZones();
      statsContent.innerHTML = '⬜ Кликни на зону';
    });

    // ============================================================
    // ГЕОЛОКАЦИЯ
    // ============================================================
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          map.setView([pos.coords.latitude, pos.coords.longitude], 15);
          L.marker([pos.coords.latitude, pos.coords.longitude])
            .addTo(map)
            .bindPopup('📍 Вы здесь');
        },
        () => {},
        { enableHighAccuracy: true }
      );
    }

    // ============================================================
    // ЗАПУСК
    // ============================================================
    drawZones();
    console.log('🏃 2 зоны, периметр рассчитан');
  </script>
</body>
</html>
