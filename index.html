<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🏃 Нячанг — Захват зон</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, Arial, sans-serif; background: #1a1a2e; }
    #map { height: 100vh; width: 100vw; }
    
    .info-panel {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      background: rgba(0,0,0,0.88);
      color: white;
      padding: 10px 14px;
      border-radius: 14px;
      display: flex;
      justify-content: space-around;
      z-index: 1000;
      font-size: 12px;
      backdrop-filter: blur(12px);
      flex-wrap: wrap;
      gap: 4px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .badge-green { background: #2ecc71; border-radius: 20px; padding: 2px 12px; font-weight: bold; }
    .badge-gray { background: #555; border-radius: 20px; padding: 2px 12px; }
    
    .controls {
      position: fixed;
      bottom: 40px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 1000;
    }
    
    button {
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      color: white;
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      box-shadow: 0 4px 20px rgba(46,204,113,0.3);
      cursor: pointer;
      transition: 0.3s;
      min-width: 140px;
    }
    button:active { transform: scale(0.95); }
    .stop-btn { background: linear-gradient(135deg, #e74c3c, #c0392b); box-shadow: 0 4px 20px rgba(231,76,60,0.3); }
    .reset-btn { 
      background: linear-gradient(135deg, #555, #333);
      min-width: 56px;
      padding: 16px 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    
    .stats {
      position: fixed;
      bottom: 120px;
      right: 16px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 12px;
      z-index: 1000;
      backdrop-filter: blur(10px);
      max-width: 170px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .stats h4 { margin-bottom: 6px; border-bottom: 1px solid #444; padding-bottom: 4px; font-size: 13px; }
    .stat-item { padding: 3px 0; border-bottom: 1px solid #2a2a2a; font-size: 11px; }

    .zone-label {
      background: rgba(0,0,0,0.75);
      color: white;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: bold;
      border: 1px solid rgba(255,255,255,0.15);
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
      font-family: monospace;
    }
    .zone-label.captured {
      background: rgba(46,204,113,0.85);
      border-color: #2ecc71;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      background: rgba(0,0,0,0.9);
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .leaflet-popup-tip { background: rgba(0,0,0,0.9); }
  </style>
</head>
<body>

  <div id="map"></div>
  
  <div class="info-panel" id="infoPanel">
    <span id="pointsCount">📍 0</span>
    <span id="distanceDisplay">📏 0 м</span>
    <span id="zoneCount">🏛️ 0/41</span>
    <span id="loopStatus" class="badge-gray">🔓 Не замкнуто</span>
  </div>

  <div class="stats" id="statsPanel">
    <h4>🏅 Захвачено</h4>
    <div id="statsContent">Пока пусто</div>
  </div>

  <div class="controls">
    <button class="reset-btn" id="resetBtn">🗑️</button>
    <button id="actionBtn">🏃 СТАРТ</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ============================================================
    // РЕАЛЬНЫЕ ЗОНЫ НЯЧАНГА (41 зона, ТОЛЬКО НА СУШЕ)
    // ============================================================
    const ZONES_DATA = [
      // ===== СЕВЕР (10 зон) =====
      { id: '01', lat: 12.285, lng: 109.205, size: 0.025, sector: 'Север' },
      { id: '02', lat: 12.278, lng: 109.210, size: 0.028, sector: 'Север' },
      { id: '03', lat: 12.272, lng: 109.215, size: 0.022, sector: 'Север' },
      { id: '04', lat: 12.268, lng: 109.208, size: 0.026, sector: 'Север' },
      { id: '05', lat: 12.262, lng: 109.212, size: 0.024, sector: 'Север' },
      { id: '06', lat: 12.258, lng: 109.205, size: 0.027, sector: 'Север' },
      { id: '07', lat: 12.252, lng: 109.210, size: 0.023, sector: 'Север' },
      { id: '08', lat: 12.248, lng: 109.215, size: 0.025, sector: 'Север' },
      { id: '09', lat: 12.242, lng: 109.208, size: 0.028, sector: 'Север' },
      { id: '10', lat: 12.238, lng: 109.213, size: 0.024, sector: 'Север' },
      
      // ===== ЦЕНТР (8 зон) =====
      { id: '11', lat: 12.235, lng: 109.200, size: 0.020, sector: 'Центр' },
      { id: '12', lat: 12.232, lng: 109.205, size: 0.022, sector: 'Центр' },
      { id: '13', lat: 12.228, lng: 109.210, size: 0.018, sector: 'Центр' },
      { id: '14', lat: 12.225, lng: 109.203, size: 0.021, sector: 'Центр' },
      { id: '15', lat: 12.222, lng: 109.208, size: 0.019, sector: 'Центр' },
      { id: '16', lat: 12.218, lng: 109.212, size: 0.020, sector: 'Центр' },
      { id: '17', lat: 12.215, lng: 109.205, size: 0.022, sector: 'Центр' },
      { id: '18', lat: 12.212, lng: 109.210, size: 0.018, sector: 'Центр' },
      
      // ===== ЮГ (9 зон) =====
      { id: '19', lat: 12.208, lng: 109.215, size: 0.025, sector: 'Юг' },
      { id: '20', lat: 12.205, lng: 109.208, size: 0.028, sector: 'Юг' },
      { id: '21', lat: 12.202, lng: 109.212, size: 0.022, sector: 'Юг' },
      { id: '22', lat: 12.198, lng: 109.218, size: 0.026, sector: 'Юг' },
      { id: '23', lat: 12.195, lng: 109.210, size: 0.024, sector: 'Юг' },
      { id: '24', lat: 12.192, lng: 109.215, size: 0.027, sector: 'Юг' },
      { id: '25', lat: 12.188, lng: 109.208, size: 0.023, sector: 'Юг' },
      { id: '26', lat: 12.185, lng: 109.213, size: 0.025, sector: 'Юг' },
      { id: '27', lat: 12.182, lng: 109.218, size: 0.028, sector: 'Юг' },
      
      // ===== ЗАПАД (7 зон) =====
      { id: '28', lat: 12.240, lng: 109.185, size: 0.030, sector: 'Запад' },
      { id: '29', lat: 12.235, lng: 109.188, size: 0.028, sector: 'Запад' },
      { id: '30', lat: 12.230, lng: 109.190, size: 0.032, sector: 'Запад' },
      { id: '31', lat: 12.225, lng: 109.185, size: 0.027, sector: 'Запад' },
      { id: '32', lat: 12.220, lng: 109.188, size: 0.030, sector: 'Запад' },
      { id: '33', lat: 12.215, lng: 109.192, size: 0.026, sector: 'Запад' },
      { id: '34', lat: 12.210, lng: 109.186, size: 0.029, sector: 'Запад' },
      
      // ===== ВОСТОК (7 зон) =====
      { id: '35', lat: 12.250, lng: 109.225, size: 0.020, sector: 'Восток' },
      { id: '36', lat: 12.242, lng: 109.228, size: 0.022, sector: 'Восток' },
      { id: '37', lat: 12.235, lng: 109.230, size: 0.018, sector: 'Восток' },
      { id: '38', lat: 12.228, lng: 109.225, size: 0.021, sector: 'Восток' },
      { id: '39', lat: 12.220, lng: 109.228, size: 0.019, sector: 'Восток' },
      { id: '40', lat: 12.212, lng: 109.230, size: 0.020, sector: 'Восток' },
      { id: '41', lat: 12.205, lng: 109.225, size: 0.022, sector: 'Восток' },
    ];

    // ============================================================
    // ГЕНЕРАЦИЯ ПОЛИГОНОВ ИЗ ДАННЫХ
    // ============================================================
    function createZonePolygon(zone) {
      const half = zone.size / 2;
      const lat = zone.lat;
      const lng = zone.lng;
      return [
        [lat - half, lng - half],
        [lat - half, lng + half],
        [lat + half, lng + half],
        [lat + half, lng - half],
        [lat - half, lng - half]
      ];
    }

    const allZones = ZONES_DATA.map(z => ({
      ...z,
      coords: createZonePolygon(z),
      area: Math.round(z.size * z.size * 111 * 111 * 10) / 10,
      status: 'free',
      owner: null
    }));

    // ============================================================
    // ИНИЦИАЛИЗАЦИЯ КАРТЫ
    // ============================================================
    const map = L.map('map', {
      center: [12.2388, 109.1967],
      zoom: 13,
      zoomControl: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // ============================================================
    // СОСТОЯНИЕ ИГРЫ
    // ============================================================
    let capturedZones = new Set();
    let isRunning = false;
    let route = [];
    let watchId = null;
    let polyline = null;
    let zoneLayers = [];
    let labelLayers = [];

    // DOM
    const pointsSpan = document.getElementById('pointsCount');
    const distanceSpan = document.getElementById('distanceDisplay');
    const zoneCountSpan = document.getElementById('zoneCount');
    const loopSpan = document.getElementById('loopStatus');
    const actionBtn = document.getElementById('actionBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statsContent = document.getElementById('statsContent');

    // ============================================================
    // РИСОВАНИЕ ЗОН
    // ============================================================
    function drawZones() {
      // Очищаем старые слои
      zoneLayers.forEach(l => map.removeLayer(l));
      labelLayers.forEach(l => map.removeLayer(l));
      zoneLayers = [];
      labelLayers = [];

      allZones.forEach(zone => {
        const isCaptured = capturedZones.has(zone.id);
        
        // Полигон зоны
        const polygon = L.polygon(zone.coords, {
          color: isCaptured ? '#2ecc71' : 'rgba(255,255,255,0.25)',
          weight: isCaptured ? 3 : 1.5,
          opacity: isCaptured ? 1 : 0.5,
          fillColor: isCaptured ? '#2ecc71' : 'rgba(255,255,255,0.05)',
          fillOpacity: isCaptured ? 0.45 : 0.1,
          interactive: true,
          className: 'zone-polygon'
        });

        // Всплывашка
        polygon.bindPopup(`
          <b>🏛️ Зона ${zone.id}</b><br>
          📍 Сектор: ${zone.sector}<br>
          📐 Площадь: ${zone.area} км²<br>
          ${isCaptured ? '✅ Захвачена' : '⬜ Свободна'}
        `);

        polygon.addTo(map);
        zoneLayers.push(polygon);

        // Метка с номером зоны (в центре)
        const label = L.marker([zone.lat, zone.lng], {
          icon: L.divIcon({
            className: `zone-label ${isCaptured ? 'captured' : ''}`,
            html: zone.id,
            iconSize: [28, 22],
            iconAnchor: [14, 11]
          }),
          interactive: false,
          keyboard: false
        });
        label.addTo(map);
        labelLayers.push(label);
      });
    }

    // ============================================================
    // ПРОВЕРКА ЗАХВАТА ЗОН
    // ============================================================
    function checkZoneCapture(points) {
      if (points.length < 3) return;
      
      const routePolygon = L.polygon([...points, points[0]]);
      const routeBounds = routePolygon.getBounds();
      
      allZones.forEach(zone => {
        if (capturedZones.has(zone.id)) return;
        
        const zonePolygon = L.polygon(zone.coords);
        const zoneBounds = zonePolygon.getBounds();
        
        if (routeBounds.intersects(zoneBounds)) {
          const center = [zone.lat, zone.lng];
          if (pointInPolygon(center, points)) {
            capturedZones.add(zone.id);
          }
        }
      });
      
      drawZones();
      updateUI();
    }

    // ============================================================
    // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================
    function pointInPolygon(point, polygon) {
      let inside = false;
      const x = point[1], y = point[0];
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const xi = polygon[i][1], yi = polygon[i][0];
        const xj = polygon[j][1], yj = polygon[j][0];
        const intersect = ((yi > y) !== (yj > y)) &&
          (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function calcDistance(points) {
      if (points.length < 2) return 0;
      let total = 0;
      for (let i = 1; i < points.length; i++) {
        total += map.distance(points[i-1], points[i]);
      }
      return total;
    }

    function isLoopClosed(points) {
      if (points.length < 5) return false;
      return map.distance(points[0], points[points.length-1]) < 50;
    }

    // ============================================================
    // ОБНОВЛЕНИЕ UI
    // ============================================================
    function updateUI() {
      pointsSpan.textContent = '📍 ' + route.length;
      distanceSpan.textContent = '📏 ' + Math.round(calcDistance(route)) + ' м';
      zoneCountSpan.textContent = '🏛️ ' + capturedZones.size + '/41';
      
      if (isLoopClosed(route) && route.length > 0) {
        loopSpan.textContent = '🔒 ПЕТЛЯ!';
        loopSpan.className = 'badge-green';
      } else {
        loopSpan.textContent = '🔓 Не замкнуто';
        loopSpan.className = 'badge-gray';
      }

      const totalArea = allZones
        .filter(z => capturedZones.has(z.id))
        .reduce((sum, z) => sum + z.area, 0);

      statsContent.innerHTML = capturedZones.size > 0 
        ? `<div class="stat-item">🏆 Зон: ${capturedZones.size}/41</div>
           <div class="stat-item">📐 Площадь: ${Math.round(totalArea)} км²</div>
           <div class="stat-item" style="border-bottom:none;color:#2ecc71;">✅ ${Math.round(totalArea / 41 * 100)}% города</div>`
        : '⬜ Ни одной';
    }

    // ============================================================
    // УПРАВЛЕНИЕ БЕГОМ
    // ============================================================
    function startRun() {
      route = [];
      isRunning = true;
      actionBtn.textContent = '⏹ СТОП';
      actionBtn.className = 'stop-btn';
      if (polyline) { map.removeLayer(polyline); polyline = null; }

      navigator.geolocation.getCurrentPosition(
        pos => {
          route.push([pos.coords.latitude, pos.coords.longitude]);
          updateUI();
        },
        () => {},
        { enableHighAccuracy: true }
      );

      watchId = navigator.geolocation.watchPosition(
        pos => {
          const p = [pos.coords.latitude, pos.coords.longitude];
          route.push(p);
          if (polyline) map.removeLayer(polyline);
          polyline = L.polyline(route, { color: '#e74c3c', weight: 4, opacity: 0.9 }).addTo(map);
          map.setView(p, 17);
          updateUI();
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 2000 }
      );
    }

    function stopRun() {
      if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      isRunning = false;
      actionBtn.textContent = '🏃 СТАРТ';
      actionBtn.className = '';

      if (route.length < 5) {
        alert('❌ Слишком короткий маршрут (нужно минимум 5 точек)');
        return;
      }

      if (isLoopClosed(route)) {
        checkZoneCapture(route);
        const count = capturedZones.size;
        alert(`🏆 Захвачено ${count} зон из 41!`);
        if (count === 41) alert('🎉 ТЫ ЗАХВАТИЛ ВЕСЬ НЯЧАНГ!');
      } else {
        alert('❌ Маршрут не замкнут!\nВернись в точку старта (расстояние < 50 м)');
      }
      updateUI();
    }

    // ============================================================
    // СБРОС
    // ============================================================
    function resetGame() {
      if (isRunning) {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        isRunning = false;
        actionBtn.textContent = '🏃 СТАРТ';
        actionBtn.className = '';
      }
      capturedZones.clear();
      route = [];
      if (polyline) { map.removeLayer(polyline); polyline = null; }
      drawZones();
      updateUI();
      alert('🗑️ Все зоны сброшены');
    }

    // ============================================================
    // КНОПКИ
    // ============================================================
    actionBtn.addEventListener('click', () => isRunning ? stopRun() : startRun());
    resetBtn.addEventListener('click', resetGame);

    // ============================================================
    // ЗАПУСК
    // ============================================================
    drawZones();
    updateUI();

    // Автоцентрирование по GPS
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          map.setView([pos.coords.latitude, pos.coords.longitude], 15);
        },
        () => {},
        { enableHighAccuracy: true }
      );
    }
  </script>
</body>
</html>
