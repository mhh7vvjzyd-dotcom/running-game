<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Running Game - Nha Trang</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #0b1221; color: white; height: 100vh; width: 100vw; overflow: hidden; position: relative; }

        /* --- ОКНО РЕГИСТРАЦИИ --- */
        #registerModal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 18, 33, 0.95); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .reg-box {
            background: #1a2332; padding: 30px; border-radius: 24px; width: 85%; max-width: 340px;
            text-align: center; border: 1px solid #2a3a52;
        }
        .reg-box h2 { color: #fff; font-size: 22px; margin-bottom: 20px; font-weight: 600; }
        .reg-box input {
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #334155;
            background: #0b1221; color: white; font-size: 16px; margin-bottom: 20px; outline: none;
        }
        .reg-box input::placeholder { color: #64748b; }
        .palette { display: flex; justify-content: center; gap: 14px; margin-bottom: 25px; }
        .c-block {
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
            border: 3px solid transparent; transition: 0.2s; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .c-block.active { border-color: #fff; transform: scale(1.2); box-shadow: 0 0 15px rgba(255,255,255,0.4); }
        .btn-register {
            width: 100%; padding: 14px; border-radius: 30px; border: none;
            background: #22c55e; color: white; font-size: 18px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn-register:active { transform: scale(0.95); background: #16a34a; }

        /* --- ИГРОВОЙ МИР --- */
        #gameContainer { display: none; width: 100%; height: 100%; position: relative; background: #0b1221; }
        
        #mapCanvas {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            background-image: radial-gradient(circle, #1f2937 1px, transparent 1px);
            background-size: 30px 30px; overflow: hidden;
        }

        /* Зоны */
        .zone {
            position: absolute; background: rgba(51, 65, 85, 0.5); border: 1px solid #475569;
            border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-weight: 600; color: #94a3b8; font-size: 16px; text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            transition: background 0.4s ease, border-color 0.4s ease, transform 0.2s ease;
            transform: scale(1); z-index: 5; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .zone.captured { 
            border-color: white; color: white; transform: scale(1.05); z-index: 6;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        .zone .label { font-size: 14px; margin-top: 2px; font-weight: 400; opacity: 0.9; }

        /* Точка игрока */
        .player-dot {
            position: absolute; width: 22px; height: 22px; border-radius: 50%;
            background: currentColor; border: 3px solid #fff; box-shadow: 0 0 20px currentColor;
            transform: translate(-50%, -50%); transition: all 0.3s linear; pointer-events: none; z-index: 20;
        }

        /* HUD (Верхняя панель) */
        #hud {
            position: absolute; top: 50px; left: 15px; right: 15px; z-index: 15;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px);
            border-radius: 16px; padding: 12px 16px; display: flex; justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .hud-item { text-align: center; }
        .hud-item .val { display: block; font-size: 20px; font-weight: 700; color: #fff; margin-top: 2px; }
        .hud-item .lbl { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Кнопки управления */
        #bottomControls {
            position: absolute; bottom: 40px; left: 0; right: 0;
            display: flex; justify-content: center; align-items: center; gap: 15px; z-index: 15; padding: 0 20px;
        }
        #btnAction {
            flex: 1; max-width: 260px; padding: 18px 20px; border-radius: 50px; border: none;
            background: #22c55e; color: white; font-size: 18px; font-weight: 700;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3); cursor: pointer; transition: 0.2s;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        #btnAction:disabled { opacity: 0.5; transform: scale(0.95); box-shadow: none; }
        #btnAction:active { transform: scale(0.95); }
        #btnAction.ready { background: #facc15; color: #0b1221; box-shadow: 0 8px 20px rgba(250, 204, 21, 0.3); }
        
        #btnTrash {
            width: 48px; height: 48px; border-radius: 50%; background: rgba(30, 41, 59, 0.8);
            border: 1px solid #475569; color: #94a3b8; font-size: 18px; display: flex; justify-content: center; align-items: center; cursor: pointer; backdrop-filter: blur(5px);
        }

        /* Таблица лидеров */
        #leaderboardBtn {
            position: absolute; bottom: 120px; right: 20px; z-index: 15;
            background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(5px);
            border: 1px solid #475569; color: #facc15; padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        #leaderboard {
            position: absolute; bottom: 180px; right: 20px; left: 20px; max-height: 50vh;
            background: rgba(11, 18, 33, 0.95); backdrop-filter: blur(10px); border: 1px solid #334155;
            border-radius: 16px; padding: 20px; z-index: 15; display: none; overflow-y: auto;
        }
        #leaderboard h3 { color: #facc15; margin-bottom: 15px; font-size: 16px; text-align: center; }
        .lb-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e293b; font-size: 15px; }
        .lb-item:last-child { border-bottom: none; }
        .lb-item .rank { color: #94a3b8; width: 25px; }
        .lb-item .score { font-weight: 700; color: #facc15; }
    </style>
</head>
<body>

    <!-- 1. РЕГИСТРАЦИЯ -->
    <div id="registerModal">
        <div class="reg-box">
            <h2>⚡ Вход</h2>
            <input type="text" id="playerNameInput" placeholder="Твой ник" maxlength="12">
            <div class="palette" id="colorPalette">
                <div class="c-block" style="background: #ef4444;" data-color="#ef4444" onclick="pickColor(this)"></div>
                <div class="c-block" style="background: #3b82f6;" data-color="#3b82f6" onclick="pickColor(this)"></div>
                <div class="c-block" style="background: #22c55e;" data-color="#22c55e" onclick="pickColor(this)"></div>
                <div class="c-block" style="background: #eab308;" data-color="#eab308" onclick="pickColor(this)"></div>
                <div class="c-block" style="background: #a855f7;" data-color="#a855f7" onclick="pickColor(this)"></div>
            </div>
            <button class="btn-register" onclick="registerPlayer()">Начать игру</button>
        </div>
    </div>

    <!-- 2. ИГРА -->
    <div id="gameContainer">
        <div id="mapCanvas"></div>

        <!-- Верхняя панель -->
        <div id="hud">
            <div class="hud-item"><span class="lbl">Захвачено</span><span class="val" id="playerScore">0</span></div>
            <div class="hud-item"><span class="lbl">Зон всего</span><span class="val">22</span></div>
        </div>

        <!-- Кнопка Таблицы -->
        <button id="leaderboardBtn" onclick="toggleLeaderboard()">🏆 Таблица</button>
        <div id="leaderboard"><h3>Турнирная таблица</h3><div id="lbContent"><p style="color:#64748b; text-align:center;">Захватите зону, чтобы появиться</p></div></div>

        <!-- Нижние кнопки -->
        <div id="bottomControls">
            <button id="btnTrash" onclick="resetGame()">🗑️</button>
            <button id="btnAction" onclick="startCapture()">🏃 СТАРТ</button>
        </div>
    </div>

    <script>
        // --- ДАННЫЕ ---
        let player = { name: 'Игрок', color: '#ef4444', score: 0 };
        let capturedZones = {}; 
        let isCapturing = false;
        let pX = 50, pY = 50; // Позиция игрока (0-100%)

        // Точная карта зон согласно нашему первому обсуждению.
        // Координаты расположены так, чтобы имитировать набережную Нячанга.
        const zones = [
            { id: 8, x: 55, y: 6, w: 55, h: 30 },   // Верх
            { id: 9, x: 40, y: 12, w: 50, h: 30 },
            { id: 10, x: 25, y: 20, w: 55, h: 35 },
            { id: 11, x: 55, y: 25, w: 50, h: 35 },
            { id: 12, x: 30, y: 33, w: 50, h: 30 },
            { id: 13, x: 60, y: 34, w: 45, h: 30 },
            { id: 14, x: 35, y: 42, w: 55, h: 30 },
            { id: 15, x: 15, y: 45, w: 50, h: 35 },
            { id: 16, x: 50, y: 46, w: 50, h: 35 },
            { id: 17, x: 65, y: 52, w: 55, h: 30 },
            { id: 18, x: 35, y: 57, w: 50, h: 30 },
            { id: 19, x: 15, y: 62, w: 55, h: 35 },
            { id: 20, x: 55, y: 63, w: 50, h: 30 },
            { id: 21, x: 25, y: 72, w: 55, h: 30 },
            { id: 22, x: 50, y: 74, w: 50, h: 30 }
        ];

        // --- ЛОГИКА ---
        function pickColor(el) {
            document.querySelectorAll('.c-block').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            player.color = el.getAttribute('data-color');
        }

        function registerPlayer() {
            const name = document.getElementById('playerNameInput').value.trim();
            if (!name) { alert('Введите имя!'); return; }
            player.name = name;
            document.getElementById('registerModal').style.display = 'none';
            document.getElementById('gameContainer').style.display = 'block';
            initGame();
        }

        function initGame() {
            renderMap();
            updateHUD();
            // Запускаем движение игрока (эмуляция GPS)
            setInterval(movePlayer, 2000);
            // Симуляция других игроков (боевые тесты)
            setTimeout(() => {
                captureBotZone(8, 'Иван', '#3b82f6');
                captureBotZone(16, 'Петр', '#22c55e');
            }, 1000);
        }

        function renderMap() {
            const map = document.getElementById('mapCanvas');
            map.innerHTML = '';
            // Рисуем зоны
            zones.forEach(z => {
                const div = document.createElement('div');
                div.className = 'zone';
                div.id = `zone-${z.id}`;
                div.style.left = z.x + '%'; div.style.top = z.y + '%';
                div.style.width = z.w + 'px'; div.style.height = z.h + 'px';
                div.innerHTML = `<span>${z.id}</span>`;
                map.appendChild(div);
            });
            // Рисуем игрока
            const dot = document.createElement('div');
            dot.id = 'playerDot';
            dot.className = 'player-dot';
            dot.style.color = player.color;
            dot.style.background = player.color;
            dot.style.left = '50%'; dot.style.top = '50%';
            map.appendChild(dot);
        }

        // Функция движения (сейчас она случайная для теста)
        function movePlayer() {
            if (isCapturing) return;
            // Двигаемся по спирали/случайно, чтобы проверять зоны
            pX += (Math.random() - 0.5) * 6;
            pY += (Math.random() - 0.5) * 6;
            pX = Math.max(2, Math.min(98, pX));
            pY = Math.max(2, Math.min(98, pY));
            document.getElementById('playerDot').style.left = pX + '%';
            document.getElementById('playerDot').style.top = pY + '%';
            checkZoneProximity();
        }

        // Проверка, находится ли игрок в зоне
        function checkZoneProximity() {
            let inZone = false;
            zones.forEach(z => {
                const el = document.getElementById(`zone-${z.id}`);
                if (!el) return;
                // Простая проверка: если центр точки попадает в прямоугольник зоны
                if (pX > z.x && pX < (z.x + (z.w / 100) * 90) && 
                    pY > z.y && pY < (z.y + (z.h / 100) * 90)) {
                    inZone = true;
                    if (!capturedZones[z.id]) {
                        // Зона свободна - кнопка становится желтой
                        document.getElementById('btnAction').className = 'ready';
                        document.getElementById('btnAction').innerHTML = '⚔️ ЗАХВАТИТЬ';
                    } else {
                        document.getElementById('btnAction').disabled = true;
                        document.getElementById('btnAction').className = '';
                        document.getElementById('btnAction').innerHTML = '⛔ ЗАНЯТО';
                    }
                }
            });
            if (!inZone) {
                document.getElementById('btnAction').className = '';
                document.getElementById('btnAction').disabled = false;
                document.getElementById('btnAction').innerHTML = '🏃 СТАРТ';
                isCapturing = false;
            }
        }

        // Захват зоны
        function startCapture() {
            if (isCapturing || document.getElementById('btnAction').disabled) return;
            if (document.getElementById('btnAction').innerText.includes('ЗАНЯТО')) return;

            isCapturing = true;
            document.getElementById('btnAction').disabled = true;
            document.getElementById('btnAction').innerHTML = '⏳ ЗАХВАТ...';
            
            setTimeout(() => {
                let targetZone = null;
                // Ищем первую свободную зону, в которой стоит игрок
                for(let z of zones) {
                    if(!capturedZones[z.id]) {
                        if (pX > z.x && pX < (z.x + (z.w / 100) * 90) && 
                            pY > z.y && pY < (z.y + (z.h / 100) * 90)) {
                            targetZone = z; break;
                        }
                    }
                }

                if (targetZone) {
                    capturedZones[targetZone.id] = {
                        playerName: player.name,
                        color: player.color,
                        timestamp: Date.now()
                    };
                    player.score++;
                    updateZoneVisual(targetZone.id);
                    updateHUD();
                    updateLeaderboard();
                    document.getElementById('btnAction').innerHTML = '✅ ГОТОВО!';
                    setTimeout(() => {
                        document.getElementById('btnAction').disabled = false;
                        document.getElementById('btnAction').className = '';
                        document.getElementById('btnAction').innerHTML = '🏃 СТАРТ';
                        isCapturing = false;
                        checkZoneProximity();
                    }, 1000);
                } else {
                    document.getElementById('btnAction').innerHTML = '❌ ОШИБКА';
                    setTimeout(() => {
                        document.getElementById('btnAction').disabled = false;
                        document.getElementById('btnAction').className = '';
                        document.getElementById('btnAction').innerHTML = '🏃 СТАРТ';
                        isCapturing = false;
                    }, 1000);
                }
            }, 2000); // Имитация времени на бег
        }

        // Визуальный захват зоны ботом
        function captureBotZone(id, name, color) {
            capturedZones[id] = { playerName: name, color: color, timestamp: Date.now() };
            updateZoneVisual(id);
            updateLeaderboard();
        }

        function updateZoneVisual(zoneId) {
            const el = document.getElementById(`zone-${zoneId}`);
            const data = capturedZones[zoneId];
            el.style.background = data.color;
            el.style.borderColor = '#fff';
            el.classList.add('captured');
            el.innerHTML = `<span>${zoneId}</span><span class="label">${data.playerName}</span>`;
        }

        function updateHUD() {
            document.getElementById('playerScore').innerText = player.score;
        }

        // Таблица лидеров
        function toggleLeaderboard() {
            const el = document.getElementById('leaderboard');
            el.style.display = el.style.display === 'none' ? 'block' : 'none';
            updateLeaderboard();
        }

        function updateLeaderboard() {
            const lb = document.getElementById('lbContent');
            let scores = {};
            Object.values(capturedZones).forEach(z => {
                if(!scores[z.playerName]) scores[z.playerName] = 0;
                scores[z.playerName]++;
            });
            if(!scores[player.name]) scores[player.name] = 0;
            
            let sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
            
            if(sorted.length === 0) {
                lb.innerHTML = '<p style="color:#64748b; text-align:center;">Захватите зону</p>';
                return;
            }
            lb.innerHTML = sorted.map(([name, score], i) => 
                `<div class="lb-item">
                    <span><span class="rank">${i+1}</span> ${name}</span>
                    <span class="score">${score}</span>
                </div>`
            ).join('');
        }

        // Сброс (Мусорка)
        function resetGame() {
            if(confirm('Сбросить прогресс?')) {
                capturedZones = {};
                player.score = 0;
                document.querySelectorAll('.zone').forEach(el => {
                    el.style.background = 'rgba(51, 65, 85, 0.5)';
                    el.style.borderColor = '#475569';
                    el.classList.remove('captured');
                    el.innerHTML = `<span>${el.id.replace('zone-', '')}</span>`;
                });
                updateHUD();
                updateLeaderboard();
                document.getElementById('btnAction').disabled = false;
                document.getElementById('btnAction').className = '';
                document.getElementById('btnAction').innerHTML = '🏃 СТАРТ';
            }
        }
    </script>
</body>
</html>
